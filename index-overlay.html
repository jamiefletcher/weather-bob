<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Weather Channel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:400,600,900" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">

        <div id="map">
            <div id="hud-container"></div>
        </div>

        <div id="side-panel"></div>

        <div id="bottom-panel"></div>

    </div>

    <script>
        let METARS_AIRPORTS = null;
        async function getMetarsAirports() {
            if (METARS_AIRPORTS) return METARS_AIRPORTS;

            const res = await fetch("data/metars/metars_airports.geojson");
            METARS_AIRPORTS = await res.json();

            return METARS_AIRPORTS;
        }

        // =========================
        // SCENE CONTROLLER
        // =========================
        const sceneController = {
            current: null,

            switch(scene) {
                if (this.current) this.current.stop();

                this.current = scene;
                this.current.start();
            }
        };

        // =========================
        // SCENE: CANADA LOOP
        // =========================
        const sceneCanada = {
            PAN_DURATION: 10000,
            INITIAL_DELAY: 2000,
            STEP_DELAY: 12000,
            map: null,
            running: false,
            timer: null,

            async start(container) {
                this.running = true;

                const data = await getMetarsAirports();
                const features = data.features.filter(f => f.properties.iso_country === "CA");

                const [lon, lat] = features[0].geometry.coordinates;

                this.map = new maplibregl.Map({
                    container: "map",
                    style: "naturalearth.json",
                    center: [lon, lat],
                    zoom: 6,
                    minZoom: 3,
                    maxZoom: 6.9
                });

                this.map.on("load", () => {
                    this.addLayers(features);
                    this.updateOverlay(features);
                    this.loop(features);
                });

                this.map.on("moveend", () => {
                    this.updateOverlay(features);
                });

                this.overlay = document.createElement("div");
this.overlay.className = "metar-overlay";
this.map.getContainer().appendChild(this.overlay);

this.labelIndex = new Map();
            },

            addLayers(features) {
                this.map.addSource("stations", {
                    type: "geojson",
                    data: {
                        type: "FeatureCollection",
                        features: features
                    }
                });

                this.map.addLayer({
                    id: "stations",
                    type: "circle",
                    source: "stations",
                    paint: {
                        "circle-radius": 4,
                        "circle-color": "black"
                    }
                });
            },

            getSafeBounds(pct = 0.1) {
                const canvas = this.map.getCanvas();
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;

                const padX = width * pct;
                const padY = height * pct;

                return {
                    contains: (lngLat) => {
                        const p = this.map.project(lngLat);

                        return (
                            p.x > padX &&
                            p.x < (width - padX) &&
                            p.y > padY &&
                            p.y < (height - padY)
                        );
                    }
                };
            },

updateOverlay(features) {
    const safeBounds = this.getSafeBounds(0.1);
    const visible = new Set();

    for (const f of features) {
        const coords = f.geometry.coordinates;
        const p = f.properties;

        if (!safeBounds.contains(coords)) continue;

        const id = p.station_id;
        visible.add(id);

        let obj = this.labelIndex.get(id);

        if (!obj) {
            const el = document.createElement("div");
            el.className = "metar-label";

            el.innerHTML = `
                <div class="popup-city">${p.municipality || id}</div>
                <div class="popup-temp">${Math.round(p.temp_c)}°</div>
            `;

            this.overlay.appendChild(el);

            obj = { el, coords };
            this.labelIndex.set(id, obj);
        }

        const pos = this.map.project(coords);
        obj.el.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
    }

    // remove out-of-view labels
    for (const [id, obj] of this.labelIndex) {
        if (visible.has(id)) continue;

        obj.el.remove();
        this.labelIndex.delete(id);
    }
},

clearOverlay() {
    if (!this.overlay) return;
    this.overlay.innerHTML = "";
    this.labelIndex.clear();
},

            loop(features) {
                const step = () => {
                    if (!this.running) return;

                    const f = features[Math.floor(Math.random() * features.length)];
                    const [lon, lat] = f.geometry.coordinates;

                    this.clearOverlay();

                    this.map.easeTo({
                        center: [lon, lat],
                        duration: this.PAN_DURATION
                    });

                    this.map.once("moveend", () => {
                        if (!this.running) return;
                        this.updateOverlay(features);
                    });

                    this.timer = setTimeout(step, this.STEP_DELAY);
                };

                this.timer = setTimeout(step, this.INITIAL_DELAY);
            },

            stop() {
                this.running = false;

                if (this.timer) clearTimeout(this.timer);

                if (this.map) {
                    this.map.remove();
                    this.map = null;
                }
            }
        };

        // =========================
        // SCENE: GLOBE LOOP
        // =========================
        const sceneGlobe = {
            PAN_DURATION: 4000,
            INITIAL_DELAY: 1000,
            STEP_DELAY: 5000,
            map: null,
            running: false,
            timer: null,
            hud: null,
            stations: [],

            async start(container) {
                this.running = true;

                const metars = await getMetars();

                // already FLATTENED → no geometry access needed
                this.stations = metars;

                const first = this.stations[0];
                const lon = first.longitude;
                const lat = first.latitude;

                // HUD
                const hudContainer = document.getElementById("hud-container");
                this.hud = document.createElement("div");
                this.hud.className = "hud";
                hudContainer.appendChild(this.hud);

                // MAP
                this.map = new maplibregl.Map({
                    container: "map",
                    style: "green.json",
                    center: [lon, lat],
                    zoom: 3,
                    pitch: 0
                });

                this.map.on("load", () => {
                    this.addLayers();
                    this.updateHUD(first);
                    this.loop();
                });
            },

            addLayers() {
                this.map.addSource("stations", {
                    type: "geojson",
                    data: {
                        type: "FeatureCollection",
                        features: this.stations
                    }
                });

                this.map.addLayer({
                    id: "stations",
                    type: "circle",
                    source: "stations",
                    paint: {
                        "circle-radius": 4,
                        "circle-color": "black"
                    }
                });
            },

            updateHUD(f) {
                this.hud.innerHTML = `
        <h2>${f.municipality || f.station_id}</h2>
        <h1>${Math.round(Number(f.temp_c))}°</h1>
    `;
            },

            loop() {
                const step = () => {
                    if (!this.running) return;

                    const f = this.stations[Math.floor(Math.random() * this.stations.length)];

                    const lon = f.longitude;
                    const lat = f.latitude;

                    this.map.easeTo({
                        center: [lon, lat],
                        duration: this.PAN_DURATION
                    });

                    this.map.once("moveend", () => {
                        if (!this.running) return;
                        this.updateHUD(f);
                    });

                    this.timer = setTimeout(step, this.STEP_DELAY);
                };

                this.timer = setTimeout(step, this.INITIAL_DELAY);
            },

            stop() {
                this.running = false;

                if (this.timer) clearTimeout(this.timer);

                if (this.map) {
                    this.map.remove();
                    this.map = null;
                }

                if (this.hud) this.hud.remove();
                this.hud = null;
            }
        };

        // =========================
        // START
        // =========================
        async function start() {
            sceneController.switch(sceneCanada);
        }

        start();
    </script>
</body>

</html>
