<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Weather Channel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Lato', sans-serif;
}

html, body {
    height: 100%;
}

body {
    color: hsl(0, 0%, 20%);
    background-color: hsl(210, 20%, 100%);
}

.container {
    height: 100%;
    width: 100%;
    display: flex;
}

#map-container {
    position: relative;
    flex: 1;
}

#map {
    position: absolute;
    inset: 0;
}
    </style>
</head>

<body>
    <div class="container">
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script>
        // GDPS tiles
        const gdpsTilesUrl = "data/gdps/tiles/{z}/{x}/{y}.png";

        const map = new maplibregl.Map({
            container: "map",
            style: {
                version: 8,
                projection: {
                    "type": "globe"
                },
                sources: {},
                layers: []
            },
            center: [0, 20],
            zoom: 1,
            maxzoom: 18,
            hash: false,
            fitBounds: [[-180, -85], [180, 85]]
        });

        map.on('load', async () => {

            // Add the OSM source
            map.addSource('osm', {
                type: "raster",
                tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
                tileSize: 256
            });

            // Add the Natural Earth source
            map.addSource('naturalearth', {
                type: "raster",
                tiles: ["data/naturalearth/{z}/{x}/{y}.png"],
                tileSize: 512
            });

            // Add the gdps source using the variable
            map.addSource('gdps', {
                type: "raster",
                tiles: [gdpsTilesUrl], // Use the variable here
                tileSize: 256
            });

            // Add the OSM layer
            map.addLayer({
                id: "osm-layer",
                type: "raster",
                source: "osm",
                minzoom: 2,
                maxzoom: 18,
                paint: {
                    'raster-opacity': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        3, 0,
                        4, 1
                    ]
                }
            });

            // Add the Natural Earth layer
            map.addLayer({
                id: "naturalearth-layer",
                type: "raster",
                source: "naturalearth",
                minzoom: 0,
                maxzoom: 4,
                paint: {
                    'raster-opacity': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        3, 1,
                        4, 0
                    ],
                    'raster-saturation': 0.2
                }
            });

            // Add the gdps layer
            map.addLayer({
                id: "gdps-layer",
                type: "raster",
                source: "gdps",
                minzoom: 0,
                maxzoom: 4,
                paint: {
                    'raster-opacity': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        3, 1,
                        4, 0
                    ],
                    "raster-brightness-min": 0.1,
                    "raster-brightness-max": 0.9,
                    "raster-contrast": 0.6,
                    "raster-opacity": 0.7
                }
            });

        });

        function getAdjustedZoom(latitude, baseZoom = 0) {
            return baseZoom + Math.log2(Math.cos(latitude * Math.PI / 180));
        }

        async function loadMetars() {
            const res = await fetch('data/metars/metars.csv');
            const text = await res.text();

            const lines = text.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());

            return lines.slice(1).map(line => {
                const cols = line.split(',');

                const obj = {};
                headers.forEach((h, i) => {
                    obj[h] = cols[i];
                });

                return obj;
            });
        }

        function panMap(stations) {
            let index = 0;

            function panToStation() {
                const s = stations[index];
                if (!s) return;

                const lat = parseFloat(s.latitude);
                const lon = parseFloat(s.longitude);

                if (Number.isFinite(lat) && Number.isFinite(lon)) {
                    map.panTo([lon, lat], {
                        duration: 1000,
                        easing: t => t,
                        animate: true,
                        zoom: getAdjustedZoom(lat, 0)
                    });
                }

                index = (index + 1) % stations.length;
            }

            panToStation();
            return setInterval(panToStation, 3000);
        }

        async function animateGlobe() {
            const metars = await loadMetars();
            panMap(metars);
        }

        animateGlobe();

        //map.dragRotate.disable();
        //map.scrollZoom.disable();

    </script>
</body>

</html>
