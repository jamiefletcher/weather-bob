<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Natural Earth x OSM x NOAA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />

</head>

<body>

    <div id="map"></div>

    <script>
        const map = new maplibregl.Map({
            container: "map",
            style: {
                version: 8,
                projection: {
                    "type": "globe"
                },
                sources: {},
                layers: []
            },
            center: [0, 20],
            zoom: 1,
            maxzoom: 18,
            hash: false,
            fitBounds: [[-180, -85], [180, 85]]
        });

        map.on('load', async () => {

            // Add the Natural Earth source
            map.addSource('naturalearth', {
                type: "raster",
                tiles: ["data/naturalearth/{z}/{x}/{y}.png"],
                tileSize: 512
            });

            // Add the OSM source
            map.addSource('osm', {
                type: "raster",
                tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
                tileSize: 256
            });

            // Add the Natural Earth layer
            map.addLayer({
                id: "naturalearth-layer",
                type: "raster",
                source: "naturalearth",
                minzoom: 0,
                maxzoom: 4,
                paint: {
                    'raster-opacity': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        3, 1,
                        4, 0
                    ]
                }
            });

            // Add the OSM layer
            map.addLayer({
                id: "osm-layer",
                type: "raster",
                source: "osm",
                minzoom: 2,
                maxzoom: 18,
                paint: {
                    'raster-opacity': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        3, 0,
                        4, 1
                    ]
                }
            });

        });

        //map.dragRotate.disable();
        //map.scrollZoom.disable();

    </script>
</body>

</html>
