<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Weather Channel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Lato', sans-serif;
        }

        html,
        body {
            height: 100%;
        }

        body {
            color: hsl(0, 0%, 20%);
            background-color: hsl(210, 20%, 100%);
        }

        .container {
            height: 100%;
            width: 100%;
            display: flex;
        }

        #map-container {
            position: relative;
            flex: 1;
        }

        #map {
            position: absolute;
            inset: 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script>
        // GDPS tiles
        const gdpsTilesUrl = "data/gdps/tiles/{z}/{x}/{y}.png";

        const map = new maplibregl.Map({
            container: "map",
            style: {
                version: 8,
                projection: {
                    "type": "globe"
                },
                sources: {},
                layers: []
            },
            center: [0, 20],
            zoom: 1,
            hash: true,
            fitBounds: [[-180, -85], [180, 85]]
        });

        map.on('load', async () => {

            // Add the OSM source
            map.addSource('osm', {
                type: "raster",
                tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
                tileSize: 256
            });

            // Add the Natural Earth source
            map.addSource('naturalearth', {
                type: "raster",
                tiles: ["data/naturalearth/{z}/{x}/{y}.png"],
                tileSize: 256
            });

            // Add the gdps source using the variable
            map.addSource('gdps', {
                type: "raster",
                tiles: [gdpsTilesUrl], // Use the variable here
                tileSize: 256
            });

            // Add the OSM layer
            // map.addLayer({
            //     id: "osm-layer",
            //     type: "raster",
            //     source: "osm",
            //     minzoom: 2,
            //     maxzoom: 18,
            //     paint: {
            //         'raster-opacity': [
            //             'interpolate',
            //             ['linear'],
            //             ['zoom'],
            //             3, 0,
            //             4, 1
            //         ]
            //     }
            // });

            // Add the Natural Earth layer
            map.addLayer({
                id: "naturalearth-layer",
                type: "raster",
                source: "naturalearth",
                minzoom: 0,
                maxzoom: 4,
                paint: {
                    'raster-opacity': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        3, 1,
                        4, 0
                    ],
                    'raster-saturation': 0.2
                }
            });

            // Add the gdps layer
            // map.addLayer({
            //     id: "gdps-layer",
            //     type: "raster",
            //     source: "gdps",
            //     minzoom: 0,
            //     maxzoom: 4,
            //     paint: {
            //         'raster-opacity': [
            //             'interpolate',
            //             ['linear'],
            //             ['zoom'],
            //             3, 1,
            //             4, 0
            //         ],
            //         "raster-brightness-min": 0.1,
            //         "raster-brightness-max": 0.9,
            //         "raster-contrast": 0.6,
            //         "raster-opacity": 0.7
            //     }
            // });

            map.setRenderWorldCopies(false);
        });

        async function loadMetars() {
            const CITY_STATIONS = [
                "Toronto, CYYZ",
                "Vancouver, CYVR",
                "Montreal, CYUL",
                "Calgary, CYYC",
                "Edmonton, CYEG",

                "New York, KJFK",
                "Los Angeles, KLAX",
                "Chicago, KORD",
                "San Francisco, KSFO",
                "Miami, KMIA",

                "London, EGLL",
                "Paris, LFPG",
                "Berlin, EDDB",
                "Madrid, LEMD",
                "Rome, LIRF",

                "Tokyo, RJTT",
                "Seoul, RKSI",
                "Beijing, ZBAA",
                "Shanghai, ZSPD",
                "Hong Kong, VHHH",

                "Sydney, YSSY",
                "Melbourne, YMML",
                "Singapore, WSSS",
                "Dubai, OMDB",
                "Istanbul, LTFM"
            ];

            const CITY_SET = new Set(
                CITY_STATIONS.map(s => s.split(",")[1].trim())
            );

            const res = await fetch('data/metars/metars.csv');
            const text = await res.text();

            const lines = text.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());

            let stations = lines.slice(1)
                .map(line => {
                    const cols = line.split(',');

                    const obj = {};
                    headers.forEach((h, i) => {
                        obj[h] = cols[i];
                    });

                    return obj;
                })
                .filter(s => CITY_SET.has(s.station_id));

            // shuffle AFTER filtering
            for (let i = stations.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [stations[i], stations[j]] = [stations[j], stations[i]];
            }

            return stations;
        }

        function panMap(stations) {
            let index = 0;

            if (!stations.length) return;

            function panToNext() {
                const s = stations[index];
                if (!s) return;

                const lat = parseFloat(s.latitude);
                const lon = parseFloat(s.longitude);

                index = (index + 1) % stations.length;

                if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                    panToNext(); // skip bad row
                    return;
                }

                map.panTo([lon, lat], {
                    duration: 2000,
                    easing: t => t
                });

                // wait for move to finish, then schedule next
                map.once('moveend', () => {
                    setTimeout(panToNext, 4000);
                });
            }

            panToNext();
        }

        async function animateGlobe() {
            const metars = await loadMetars();
            panMap(metars);
        }

        animateGlobe();

        //map.dragRotate.disable();
        //map.scrollZoom.disable();

    </script>
</body>

</html>
