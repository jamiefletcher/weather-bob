<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Weather Channel</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Playfair+Display:400,600,900" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    width: 100%;
    line-height: 1;
    font-family: 'Lato',sans-serif;
    font-size: clamp(12px,calc(1vw + 1vh),90px);
    color: hsl(0, 0%, 40%);
}

.container {
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.top-row {
    display: flex;
    height: 75%;
    width: 100%;
}

#map-container {
    position: relative;
    width: 75%;
    height: 100%;
    overflow: hidden;
}

#map2-container {
    position: relative;
    width: 25%;
    height: 100%;
    overflow: hidden;
}

#map,
#map2 {
    position: absolute;
    inset: 0;
}

#map2 {
    background-color: hsl(0, 0%, 30%);
}

#hud,
#hud2 {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: space-between;
    padding: 10px;
    z-index: 10;
    pointer-events: none;
}

#hud2 {
    color: hsl(0, 0%, 100%);
}

#hud-left,
#hud-right,
#hud2-left,
#hud2-right {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

#hud-left,
#hud2-left {
    align-items: flex-start;
}

#hud-right,
#hud2-right {
    align-items: flex-end;
}

#bottom-panel {
    height: 25%;
    width: 100%;
    overflow: hidden;
    background: hsl(0, 0%, 98%);
    border-top: 1px solid hsl(0, 0%, 90%);
}

#forecast-scroll {
    height: 100%;
    overflow-y: auto;
    padding: 10px;
}

.maplibregl-ctrl-bottom-right {
    display: none;
}

h1 {
    font-size: 3rem;
    font-weight: 300;
}

h2 {
    font-size: 1.6rem;
    font-weight: 400;
}

h3 {
    font-size: 1.2rem;
    font-weight: 400;
}

h4 {
    font-size: 1rem;
    font-weight: 300;
}

.degree {
    font-size: 1.6rem;
    font-weight: 400;
    vertical-align: super;
    margin-left: 2px;
}

@media (min-width: 1024px) {
}
</style>
</head>

<body>
<div class="container">

    <!-- TOP ROW -->
    <div class="top-row">

        <div id="map-container">
            <div id="hud">
                <div id="hud-left"></div>
                <div id="hud-right"></div>
            </div>
            <div id="map"></div>
        </div>

        <div id="map2-container">
            <div id="hud2">
                <div id="hud2-left"></div>
                <div id="hud2-right"></div>
            </div>
            <div id="map2"></div>
        </div>

    </div>

    <!-- BOTTOM PANEL -->
    <div id="bottom-panel">
        <div id="forecast-scroll">
            <!-- dynamic 7-day forecast goes here -->
        </div>
    </div>

</div>
<script>
const INITIAL_DELAY = 3000;
const PAN_DURATION = 6000;
const STEP_DELAY = 9000;

const GLOBE_STATIONS = [
    ["Toronto", "CYYZ"],
    ["Vancouver", "CYVR"],
    ["Montreal", "CYUL"],
    ["Calgary", "CYYC"],
    ["Edmonton", "CYEG"],
    ["New York", "KJFK"],
    ["Los Angeles", "KLAX"],
    ["Chicago", "KORD"],
    ["San Francisco", "KSFO"],
    ["Miami", "KMIA"],
    ["London", "EGLL"],
    ["Paris", "LFPG"],
    ["Berlin", "EDDB"],
    ["Madrid", "LEMD"],
    ["Rome", "LIRF"],
    ["Tokyo", "RJTT"],
    ["Seoul", "RKSI"],
    ["Beijing", "ZBAA"],
    ["Shanghai", "ZSPD"],
    ["Hong Kong", "VHHH"],
    ["Sydney", "YSSY"],
    ["Melbourne", "YMML"],
    ["Singapore", "WSSS"],
    ["Dubai", "OMDB"],
    ["Istanbul", "LTFM"]
];

const GLOBE_MAP = new Map(
    GLOBE_STATIONS.map(([city, code]) => [code, city])
);

// =========================
// LOAD METARS
// =========================
async function loadMetars() {
    const res = await fetch('data/metars/metars.cache.xml');
    const text = await res.text();

    const xml = new DOMParser().parseFromString(text, 'application/xml');
    const metarNodes = Array.from(xml.getElementsByTagName('METAR'));

    return metarNodes
        .map(node => {
            const row = {};

            Array.from(node.children).forEach(child => {
                const key = child.tagName;

                if (row[key]) {
                    if (!Array.isArray(row[key])) row[key] = [row[key]];
                    row[key].push(parseNode(child));
                } else {
                    row[key] = parseNode(child);
                }
            });

            const station_id = row.station_id;
            const lat = parseFloat(row.latitude);
            const lon = parseFloat(row.longitude);

            // only reject totally unusable records
            if (!station_id || !Number.isFinite(lat) || !Number.isFinite(lon)) {
                return null;
            }

            return {
                ...row,
                station_id,
                latitude: lat,
                longitude: lon
            };
        })
        .filter(Boolean);
}

// helper: handles text + attributes
function parseNode(node) {
    const hasAttributes = node.attributes.length > 0;

    // if no attributes, just return text
    if (!hasAttributes) return node.textContent;

    // otherwise return object with attributes + value
    const obj = {};

    Array.from(node.attributes).forEach(attr => {
        obj[attr.name] = attr.value;
    });

    if (node.textContent.trim()) {
        obj.value = node.textContent;
    }

    return obj;
}

function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function decodeWx(wx) {
    if (!wx) return "";

    const INTENSITY = {
        "-": "Light",
        "+": "Heavy",
        "VC": "Nearby"
    };

    const DESCRIPTOR = {
        "MI": "Shallow",
        "PR": "Partial",
        "BC": "Patches",
        "DR": "Drifting",
        "BL": "Blowing",
        "SH": "Showers",
        "TS": "Thunderstorm",
        "FZ": "Freezing"
    };

    const PHENOMENA = {
        "RA": "Rain",
        "DZ": "Drizzle",
        "SN": "Snow",
        "SG": "Snow Grains",
        "IC": "Ice Crystals",
        "PL": "Ice Pellets",
        "GR": "Hail",
        "GS": "Graupel",
        "UP": "Unknown Precip",
        "FG": "Fog",
        "VA": "Ash",
        "BR": "Mist",
        "HZ": "Haze",
        "DU": "Dust",
        "FU": "Smoke",
        "SA": "Sand",
        "PY": "Spray",
        "SQ": "Squall",
        "PO": "Dust Whirls",
        "DS": "Duststorm",
        "SS": "Sandstorm",
        "FC": "Funnel Cloud"
    };

    return wx.trim().split(/\s+/).map(token => {
        let intensity = "";
        let descriptor = "";
        let phenomenon = "";

        // intensity
        if (token.startsWith("VC")) {
            intensity = INTENSITY["VC"];
            token = token.slice(2);
        } else if (token.startsWith("-") || token.startsWith("+")) {
            intensity = INTENSITY[token[0]];
            token = token.slice(1);
        }

        // descriptor (2-letter prefix)
        const desc = token.slice(0, 2);
        if (DESCRIPTOR[desc]) {
            descriptor = DESCRIPTOR[desc];
            token = token.slice(2);
        }

        // remaining = phenomenon
        phenomenon = PHENOMENA[token] || token;

        return [intensity, descriptor, phenomenon]
            .filter(Boolean)
            .join(" ");
    }).join(", ");
}

function decodeSkyCondition(sky) {
    if (!sky) return "";

    const COVER = {
        "SKC": "Clear",
        "CLR": "Clear",
        "NSC": "Clear",
        "FEW": "Partly Cloudy",
        "SCT": "Partly Cloudy",
        "BKN": "Mostly Cloudy",
        "OVC": "Overcast",
        "VV": "Obscured"
    };

    const layers = Array.isArray(sky) ? sky : [sky];
    const top = layers[0]; // dominant / lowest layer is most relevant visually

    if (!top || !top.sky_cover) return "Clear";

    return COVER[top.sky_cover] || "Cloudy";
}

function panGlobeMap(stations) {
    if (!stations.length) return;

    let index = 1;

    function step() {
        const s = stations[index];
        index = (index + 1) % stations.length;

        if (!Number.isFinite(s.latitude) || !Number.isFinite(s.longitude)) {
            step();
            return;
        }

        map2.easeTo({
            center: [s.longitude, s.latitude],
            duration: PAN_DURATION,
            essential: true
        });

        map2.once('moveend', () => {
            updateHUD(s);
        });

        setTimeout(step, STEP_DELAY);
    }

    setTimeout(step, INITIAL_DELAY);
}

function updateHUD(s) {
    const hud = document.getElementById("hud2-left");

    const temp = Math.round(parseFloat(s.temp_c));
    const wxText = decodeWx(s.wx_string);
    const skyText = decodeSkyCondition(s.sky_condition);

    hud.innerHTML = `
        <div class="hud-item">
            <h2>${s.city}</h2>
            <h1>${temp}<span class="degree">°</span></h1>
            <h3>${skyText}</h3>
            <h3>${wxText}</h3>
        </div>

        <!--<div class="hud-item">
            <span class="hud-label">SKY</span>
            <span class="hud-value">${wxText}</span>
        </div>-->
    `;
}

// =========================
// MAP INIT (AFTER DATA)
// =========================
let map;
let map2;

async function start() {

    const stations = await loadMetars();
    const first = stations[0];
    if (!first) return;

    const globeStationsRaw = stations
        .filter(s => GLOBE_MAP.has(s.station_id))
        .map(s => ({
            ...s,
            city: GLOBE_MAP.get(s.station_id)
        }));
    const globeStations = shuffle([...globeStationsRaw]);
    const firstGlobe = globeStations[0];

    map = new maplibregl.Map({
        container: "map",
        style: {
            version: 8,
            projection: { type: "mercator" },
            sources: {},
            layers: [
                {
                    id: "background",
                    type: "background",
                    paint: {
                        "background-color": "#8ddbf6"
                    }
                }
            ]
        },
        hash: true,
        center: [-79.3832, 43.6532],
        zoom: 5,
        pitch: 0,
        minZoom: 4,
        maxZoom: 6.9,
        maxBounds: [
            [-145, 40],  // west + south buffer
            [-50, 85]    // east + north buffer
        ]
    });

    map.on('load', () => {

        map.addSource('countries', {
            type: 'vector',
            tiles: ["https://jamiefletcher.github.io/weather-bob/data/naturalearth/countries/{z}/{x}/{y}.pbf"],
        });

        map.addSource('lakes', {
            type: 'vector',
            tiles: ["https://jamiefletcher.github.io/weather-bob/data/naturalearth/lakes/{z}/{x}/{y}.pbf"],
        });

        map.addSource('provinces_lines', {
            type: 'vector',
            tiles: ["https://jamiefletcher.github.io/weather-bob/data/naturalearth/provinces_lines/{z}/{x}/{y}.pbf"],
        });

        map.addSource('roads', {
            type: 'vector',
            tiles: ["https://jamiefletcher.github.io/weather-bob/data/naturalearth/roads/{z}/{x}/{y}.pbf"],
        });

        map.addSource('urbanareas', {
            type: 'vector',
            tiles: ["https://jamiefletcher.github.io/weather-bob/data/naturalearth/urbanareas/{z}/{x}/{y}.pbf"],
        });

        map.addLayer({
            id: 'countries',
            source: 'countries',
            'source-layer': 'countries',
            type: 'fill',
            paint: {
                'fill-color': '#dfefc1'
            }
        });

        map.addLayer({
            id: 'urbanareas',
            source: 'urbanareas',
            'source-layer': 'urbanareas',
            type: 'fill',
            paint: {
                'fill-color': '#f1f0eb'
            }
        });

        map.addLayer({
            id: 'countries-lines',
            source: 'countries',
            'source-layer': 'countries',
            type: 'line',
            paint: {
                'line-color': 'hsl(0, 0%, 100%)',
                'line-width': 2
            }
        });

        map.addLayer({
            id: 'provinces-lines',
            source: 'provinces_lines',
            'source-layer': 'provinces_lines',
            type: 'line',
            paint: {
                'line-color': 'hsl(0, 0%, 100%)',
                'line-width': 2,
                'line-dasharray': [2, 2]
            }
        });

        map.addLayer({
            id: 'lakes',
            source: 'lakes',
            'source-layer': 'lakes',
            type: 'fill',
            paint: {
                'fill-color': '#8ddbf6'
            }
        });
    });

    map2 = new maplibregl.Map({
        container: "map2",
        style: {
            version: 8,
            projection: { type: "globe" },
            sources: {},
            layers: []
        },
        hash: false,
        center: [firstGlobe.longitude, firstGlobe.latitude],
        zoom: -1,
        pitch: 0
    });

    map2.on('load', () => {

        map2.addSource('naturalearth', {
            type: "raster",
            tiles: ["data/naturalearth/raster/{z}/{x}/{y}.png"],
            tileSize: 256
        });

        map2.addSource('gdps', {
            type: "raster",
            tiles: ["data/gdps/tiles/{z}/{x}/{y}.png"],
            tileSize: 256
        });

        map2.addLayer({
            id: "naturalearth",
            type: "raster",
            source: "naturalearth",
            paint: {
                'raster-saturation': 0.2
            }
        });

        map2.addLayer({
            id: "gdps",
            type: "raster",
            source: "gdps",
            paint: {
                'raster-opacity': 0.5,
                'raster-contrast': 0.6
            }
        });

        updateHUD(firstGlobe);
        panGlobeMap(globeStations);
    });

}

start();
</script>
</body>
</html>
