<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Weather Channel</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Lato', sans-serif;
    color: hsl(0, 0%, 40%);
}

html, body {
    height: 100%;
    width: 100%;
    line-height: 0.9;
}

.container {
    height: 100%;
    width: 100%;
}

#map-container {
    position: relative;
    height: 30%;
    overflow: hidden;
    background: radial-gradient(
        circle at 50% 100%,
        var(--weather-color),
        transparent 80%
    );
}

#map {
    position: absolute;
    inset: 0;
}

#hud {
    display: flex;
    position: absolute;
    inset: 0;
    padding: 20px;
    z-index: 1
}

#hud-left,
#hud-right {
    flex: 1;
    position: relative;
}

.maplibregl-ctrl-bottom-right {
    display: none;
}

h1 {
    font-size: 60px;
    font-weight: 300;
    letter-spacing: -5px;
}

h2 {
    font-weight: 400;
}

.degree {
    font-size: 0.5em;
    font-weight: 400;
    vertical-align: super;
    margin-left: 2px;
}

/* DESKTOP */
@media (min-width: 1024px) {
    h1 {
        font-size: 120px;
    }
}
</style>
</head>

<body>
<div class="container">
    <div id="map-container">

        <div id="hud">
            <div id="hud-left">
                <div id="hud-city"></div>
                <div id="hud-temp"></div>
            </div>
            <div id="hud-right"></div>
        </div>

        <div id="map"></div>

    </div>
</div>

<script>
// =========================
// CONFIG
// =========================
const CITY_STATIONS = [
    ["Toronto", "CYYZ"],
    ["Vancouver", "CYVR"],
    ["Montreal", "CYUL"],
    ["Calgary", "CYYC"],
    ["Edmonton", "CYEG"],
    ["New York", "KJFK"],
    ["Los Angeles", "KLAX"],
    ["Chicago", "KORD"],
    ["San Francisco", "KSFO"],
    ["Miami", "KMIA"],
    ["London", "EGLL"],
    ["Paris", "LFPG"],
    ["Berlin", "EDDB"],
    ["Madrid", "LEMD"],
    ["Rome", "LIRF"],
    ["Tokyo", "RJTT"],
    ["Seoul", "RKSI"],
    ["Beijing", "ZBAA"],
    ["Shanghai", "ZSPD"],
    ["Hong Kong", "VHHH"],
    ["Sydney", "YSSY"],
    ["Melbourne", "YMML"],
    ["Singapore", "WSSS"],
    ["Dubai", "OMDB"],
    ["Istanbul", "LTFM"]
];

const CITY_MAP = new Map(
    CITY_STATIONS.map(([city, code]) => [code, city])
);

const INITIAL_DELAY = 2000
const PAN_DURATION = 4000
const STEP_DELAY = 5000

// =========================
// GLOBAL MAP
// =========================
let map;

// =========================
// LOAD METARS
// =========================
async function loadMetars() {
    const res = await fetch('data/metars/metars.csv');
    const text = await res.text();

    const lines = text.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.trim());

    const stations = lines.slice(1).map(line => {
        const cols = line.split(',');

        const row = {};
        headers.forEach((h, i) => row[h] = cols[i]);

        return {
            station_id: row.station_id,
            latitude: parseFloat(row.latitude),
            longitude: parseFloat(row.longitude),
            temp: parseFloat(row.temp_c),
            city: CITY_MAP.get(row.station_id) || row.station_id
        };
    })
    .filter(s =>
        CITY_MAP.has(s.station_id) &&
        Number.isFinite(s.latitude) &&
        Number.isFinite(s.longitude)
    );

    return stations;
}

function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// =========================
// HUD
// =========================
function updateHUD(s) {
    document.getElementById("hud-city").innerHTML =
        `<h2>${s.city}</h2>`;

    document.getElementById("hud-temp").innerHTML =
        `<h1>${Math.round(s.temp)}<span class="degree">°</span></h1>`;
}

// =========================
// BACKGROUND GRADIENT
// =========================
const TEMP_COLOR_MAP = [
    [-30, -15, "hsla(220, 90%, 75%, 0.5)"],
    [-15,   0, "hsla(210, 85%, 78%, 0.5)"],
    [  0,  10, "hsla(200, 80%, 82%, 0.5)"],
    [ 10,  18, "hsla(190, 60%, 85%, 0.5)"],
    [ 18,  24, "hsla(40, 80%, 80%, 0.5)"],
    [ 24,  30, "hsla(30, 85%, 70%, 0.5)"],
    [ 30, 100, "hsla(10, 90%, 65%, 0.5)"]
];

function updateGradient(s) {
    const temp = parseFloat(s.temp);

    let color = "hsl(200, 80%, 85%)"; // fallback

    for (const [min, max, c] of TEMP_COLOR_MAP) {
        if (temp >= min && temp < max) {
            color = c;
            break;
        }
    }

    document.documentElement.style.setProperty('--weather-color', color);
}

// =========================
// ANIMATION
// =========================
function panMap(stations) {
    if (!stations.length) return;

    let index = 1; // 👈 skip first station (already set)

    function step() {
        const s = stations[index];
        index = (index + 1) % stations.length;

        if (!Number.isFinite(s.latitude) || !Number.isFinite(s.longitude)) {
            step();
            return;
        }

        map.easeTo({
            center: [s.longitude, s.latitude],
            duration: PAN_DURATION,
            essential: true
        });

        map.once('moveend', () => {
            updateHUD(s);
            updateGradient(s);
        });

        setTimeout(step, STEP_DELAY);
    }

    setTimeout(step, INITIAL_DELAY);
}

// =========================
// MAP INIT (AFTER DATA)
// =========================
async function start() {

    const stations = shuffle(await loadMetars());
    const first = stations[0];

    if (!first) return;

    // INIT MAP ONLY AFTER DATA IS READY
    map = new maplibregl.Map({
        container: "map",
        style: {
            version: 8,
            projection: { type: "globe" },
            sources: {},
            layers: []
        },
        hash: false,
        center: [first.longitude, first.latitude],
        zoom: 0,
        pitch: 30
    });

    map.on('load', () => {

        map.addSource('naturalearth', {
            type: "raster",
            tiles: ["data/naturalearth/{z}/{x}/{y}.png"],
            tileSize: 256
        });

        map.addSource('gdps', {
            type: "raster",
            tiles: ["data/gdps/tiles/{z}/{x}/{y}.png"],
            tileSize: 256
        });

        map.addLayer({
            id: "naturalearth",
            type: "raster",
            source: "naturalearth",
            paint: {
                'raster-saturation': 0.2
            }
        });

        map.addLayer({
            id: "gdps",
            type: "raster",
            source: "gdps",
            paint: {
                'raster-opacity': 0.7,
                'raster-contrast': 0.6
            }
        });

        map.setRenderWorldCopies(false);

        // FIRST FRAME
        updateHUD(first);
        updateGradient(first);

        panMap(stations);
    });
}

start();
</script>
</body>
</html>
