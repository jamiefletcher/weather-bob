<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Weather Channel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:400,600,900" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            line-height: 1;
            font-family: 'Lato', sans-serif;
            font-size: clamp(12px, 1vw, 90px);
            color: hsl(0, 0%, 40%);
        }

        .app {
            height: 100%;
            width: 100%;

            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr clamp(140px, 20vh, 260px);

            grid-template-areas:
                "map"
                "bottom";
        }

        /*
        .app {
            height: 100%;
            width: 100%;

            display: grid;
            grid-template-columns: 1fr clamp(240px, 25vw, 400px);
            grid-template-rows: 1fr clamp(140px, 20vh, 260px);

            grid-template-areas:
                "map side"
                "bottom bottom";
        }
*/

        #map {
            grid-area: map;
            position: relative;
        }

        #map>.maplibregl-canvas-container,
        #map canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .maplibregl-ctrl-bottom-right {
            display: none;
        }

        #hud-container {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;

            width: 100%;
            height: 100%;

            pointer-events: none;

            display: flex;
            align-items: flex-start;
            justify-content: flex-start;

            padding: 2rem;
        }

        .hud {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);

            padding: 1.2rem 1.4rem;
            border-radius: 14px;

            max-width: 320px;

            color: white;

            display: flex;
            flex-direction: column;
            gap: 0.3rem;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);

            padding: 1.2rem 1.4rem;
            border-radius: 14px;

            max-width: 320px;

            color: white;

            display: flex;
            flex-direction: column;
            gap: 0.3rem;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        #side-panel {
            grid-area: side;
            overflow: hidden;
            background: hsl(0, 0%, 30%);
            color: white;
        }

        #bottom-panel {
            grid-area: bottom;
            overflow: hidden;
            background: hsl(0, 0%, 98%);
        }

        .popup-places {
            position: relative;
            overflow: visible;
            border: 2px solid hsl(0, 0%, 100%);
            border-radius: 5px;
            line-height: 1;
            background-color: hsl(0, 0%, 100%);
            color: hsl(270, 35%, 20%);
            box-shadow: 1px 1px 2px hsla(0, 0%, 0%, 0.1);
        }

        .popup-wx-badge {
            position: absolute;
            bottom: -0.5rem;
            right: -0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: hsla(0, 0%, 100%, 1);
            border-radius: 5px;
            padding: 2px;
            aspect-ratio: 1 / 1;
            font-size: 1rem;
            line-height: 1;
            box-shadow: 1px 1px 4px hsla(0, 0%, 0%, 0.2);
            z-index: 10;
            pointer-events: none;
        }

        .popup-city {
            background: hsl(135, 45%, 68%);
            color: hsl(270, 35%, 100%);
            border-radius: 5px 5px 0 0;
            padding: 5px;
        }

        .popup-data {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: left;
            gap: 0.05rem;
            padding: 5px;
        }

        .maplibregl-popup-content .popup-places h2 {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .maplibregl-popup.popup-long-city .popup-places h2 {
            font-size: 0.7rem;
        }

        .maplibregl-popup-content .popup-places .popup-data h1 {
            font-size: 1.4rem;
            font-weight: 500;
        }

        .maplibregl-popup-tip .popup-places {
            border-color: hsla(270, 35%, 100%, 0);
        }

        .maplibregl-popup,
        .maplibregl-popup * {
            pointer-events: none;
            user-select: none;
        }

        .maplibregl-popup {
            min-width: 0 !important;
            max-width: 80px !important;
        }

        .maplibregl-popup-content {
            padding: 0 !important;
            background: transparent;
            box-shadow: none;
        }

        .maplibregl-popup-content {
            opacity: 0;
            transform: translateY(8px) scale(0.95);
            transition: opacity 280ms ease, transform 280ms ease;
        }

        .maplibregl-popup.popup-visible .maplibregl-popup-content {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .taf-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;

            background: rgba(255, 255, 255, 0.9);
            padding: 12px 16px;
            border-radius: 8px;

            font-family: sans-serif;
            max-width: 320px;

            display: none;
        }

        .taf-city {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .taf-row {
            font-size: 12px;
            margin-bottom: 4px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 400;
        }

        h3 {
            font-size: 1.2rem;
            font-weight: 400;
        }

        h4 {
            font-size: 1rem;
            font-weight: 300;
        }

        @media (min-width: 1024px) {}
    </style>
</head>

<body>
    <div class="app">

        <div id="map">
            <div id="hud-container"></div>
        </div>

        <div id="side-panel"></div>

        <div id="bottom-panel"></div>

    </div>
    <script>
        // =========================
        // LOAD METARS
        // =========================
        async function loadMetars() {
            const res = await fetch('data/metars/metars.cache.xml');
            const text = await res.text();

            const xml = new DOMParser().parseFromString(text, 'application/xml');
            const metarNodes = Array.from(xml.getElementsByTagName('METAR'));

            return metarNodes
                .map(node => {
                    const row = {};

                    Array.from(node.children).forEach(child => {
                        const key = child.tagName;

                        if (row[key]) {
                            if (!Array.isArray(row[key])) row[key] = [row[key]];
                            row[key].push(parseNode(child));
                        } else {
                            row[key] = parseNode(child);
                        }
                    });

                    const station_id = row.station_id;
                    const lat = parseFloat(row.latitude);
                    const lon = parseFloat(row.longitude);

                    // only reject totally unusable records
                    if (!station_id || !Number.isFinite(lat) || !Number.isFinite(lon)) {
                        return null;
                    }

                    return {
                        ...row,
                        station_id,
                        latitude: lat,
                        longitude: lon
                    };
                })
                .filter(Boolean);
        }

        // =========================
        // LOAD TAFS
        // =========================
        async function loadTafs() {
            const res = await fetch('data/metars/tafs.cache.xml');
            const text = await res.text();

            const xml = new DOMParser().parseFromString(text, 'application/xml');
            const tafNodes = Array.from(xml.getElementsByTagName('TAF'));

            return tafNodes
                .map(node => {
                    const row = {};
                    const forecast = [];

                    Array.from(node.children).forEach(child => {
                        const key = child.tagName;

                        if (key === 'forecast') {
                            const fcst = {};

                            Array.from(child.children).forEach(fcChild => {
                                const fcKey = fcChild.tagName;

                                if (fcKey === 'sky_condition') {
                                    fcst.sky_condition = {
                                        sky_cover: fcChild.getAttribute('sky_cover'),
                                        cloud_base_ft_agl: parseFloat(fcChild.getAttribute('cloud_base_ft_agl'))
                                    };
                                } else {
                                    fcst[fcKey] = parseNode(fcChild);
                                }
                            });

                            // normalize numbers
                            fcst.wind_dir_degrees = parseFloat(fcst.wind_dir_degrees);
                            fcst.wind_speed_kt = parseFloat(fcst.wind_speed_kt);
                            fcst.wind_gust_kt = fcst.wind_gust_kt ? parseFloat(fcst.wind_gust_kt) : null;

                            forecast.push(fcst);

                        } else {
                            if (row[key]) {
                                if (!Array.isArray(row[key])) row[key] = [row[key]];
                                row[key].push(parseNode(child));
                            } else {
                                row[key] = parseNode(child);
                            }
                        }
                    });

                    const station_id = row.station_id;
                    const lat = parseFloat(row.latitude);
                    const lon = parseFloat(row.longitude);

                    if (!station_id || !Number.isFinite(lat) || !Number.isFinite(lon)) {
                        return null;
                    }

                    return {
                        ...row,
                        station_id,
                        latitude: lat,
                        longitude: lon,

                        forecast: forecast.map(f => ({
                            fcst_time_from: f.fcst_time_from ?? null,
                            fcst_time_to: f.fcst_time_to ?? null,

                            wind_dir_degrees: Number.isFinite(f.wind_dir_degrees) ? f.wind_dir_degrees : null,
                            wind_speed_kt: Number.isFinite(f.wind_speed_kt) ? f.wind_speed_kt : null,
                            wind_gust_kt: Number.isFinite(f.wind_gust_kt) ? f.wind_gust_kt : null,

                            sky_condition: f.sky_condition ?? {
                                sky_cover: null,
                                cloud_base_ft_agl: null
                            }
                        }))
                    };
                })
                .filter(Boolean)
                .filter(t => t.forecast.length > 0);
        }

        // =========================
        // LOAD STATIONS PLACES
        // =========================
        async function loadStationsPlaces() {
            const res = await fetch('data/metars/stations_places.geojson');
            const geojson = await res.json();

            if (!geojson || !geojson.features) {
                return { type: "FeatureCollection", features: [] };
            }

            return geojson;
        }

        function parseNode(node) {
            const hasAttributes = node.attributes.length > 0;

            // if no attributes, just return text
            if (!hasAttributes) return node.textContent;

            // otherwise return object with attributes + value
            const obj = {};

            Array.from(node.attributes).forEach(attr => {
                obj[attr.name] = attr.value;
            });

            if (node.textContent.trim()) {
                obj.value = node.textContent;
            }

            return obj;
        }

        function shuffle(a) {
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function decodeWx(wx) {
            if (!wx) return "";

            const INTENSITY = {
                "-": "Light",
                "+": "Heavy",
                "VC": "Nearby"
            };

            const DESCRIPTOR = {
                "MI": "Shallow",
                "PR": "Partial",
                "BC": "Patches",
                "DR": "Drifting",
                "BL": "Blowing",
                "SH": "Showers",
                "TS": "Thunderstorm",
                "FZ": "Freezing"
            };

            const PHENOMENA = {
                "RA": "Rain",
                "DZ": "Drizzle",
                "SN": "Snow",
                "SG": "Snow Grains",
                "IC": "Ice Crystals",
                "PL": "Ice Pellets",
                "GR": "Hail",
                "GS": "Graupel",
                "UP": "Unknown Precip",
                "FG": "Fog",
                "VA": "Ash",
                "BR": "Mist",
                "HZ": "Haze",
                "DU": "Dust",
                "FU": "Smoke",
                "SA": "Sand",
                "PY": "Spray",
                "SQ": "Squall",
                "PO": "Dust Whirls",
                "DS": "Duststorm",
                "SS": "Sandstorm",
                "FC": "Funnel Cloud"
            };

            return wx.trim().split(/\s+/).map(token => {
                let intensity = "";
                let descriptor = "";
                let phenomenon = "";

                // intensity
                if (token.startsWith("VC")) {
                    intensity = INTENSITY["VC"];
                    token = token.slice(2);
                } else if (token.startsWith("-") || token.startsWith("+")) {
                    intensity = INTENSITY[token[0]];
                    token = token.slice(1);
                }

                // descriptor (2-letter prefix)
                const desc = token.slice(0, 2);
                if (DESCRIPTOR[desc]) {
                    descriptor = DESCRIPTOR[desc];
                    token = token.slice(2);
                }

                // remaining = phenomenon
                phenomenon = PHENOMENA[token] || token;

                return [intensity, descriptor, phenomenon]
                    .filter(Boolean)
                    .join(" ");
            }).join(", ");
        }

        function decodeWxIcon(wx) {
            if (!wx) return "";

            const RAIN = new Set(["RA", "DZ"]);
            const SNOW = new Set(["SN", "SG", "GR", "GS", "PL"]);
            const STORM = new Set(["TS"]);

            const seen = new Set();

            return wx.trim()
                .split(/\s+/)
                .map(token => {
                    token = token.replace(/^[-+]/, "");
                    const code = token.slice(0, 2);

                    let icon = ""; // default fallback (no clouds)

                    if (STORM.has(code)) icon = "⚡";
                    else if (RAIN.has(code)) icon = "💧";
                    else if (SNOW.has(code)) icon = "❄️";

                    return icon;
                })
                .filter(icon => {
                    if (!icon) return false;
                    if (seen.has(icon)) return false;
                    seen.add(icon);
                    return true;
                })
                .join(" ");
        }

        function decodeSkyCondition(sky) {
            if (!sky) return "";

            const COVER = {
                "SKC": "Clear",
                "CLR": "Clear",
                "NSC": "Clear",
                "FEW": "Partly Cloudy",
                "SCT": "Partly Cloudy",
                "BKN": "Mostly Cloudy",
                "OVC": "Overcast",
                "VV": "Obscured"
            };

            const layers = Array.isArray(sky) ? sky : [sky];
            const top = layers[0]; // dominant / lowest layer is most relevant visually

            if (!top || !top.sky_cover) return "Clear";

            return COVER[top.sky_cover] || "Cloudy";
        }

        function decodeSkyConditionSymbol(sky) {
            if (!sky) return "☀️";

            const SYMBOL = {
                "SKC": "☀️",
                "CLR": "☀️",
                "NSC": "🌤️",
                "FEW": "🌤️",
                "SCT": "⛅",
                "BKN": "☁️",
                "OVC": "☁️",
                "VV": "🌫️"
            };

            const layers = Array.isArray(sky) ? sky : [sky];
            const top = layers[0];

            if (!top || !top.sky_cover) return "☀️";

            return SYMBOL[top.sky_cover] || "☁️";
        }

        const SceneController = {
            current: null,
            scenes: {},

            register(name, scene) {
                this.scenes[name] = scene;
            },

            switch(name, container, data) {
                if (this.current) {
                    this.current.stop();
                    this.current = null;
                }

                const next = this.scenes[name];
                if (!next) return false;

                this.current = next;
                next.start(container, data);

                return true;
            }
        };

        window.SceneController = SceneController;

        const Scene1 = {
            INITIAL_DELAY: 1000,
            STEP_DELAY: 3000,

            map: null,
            timer: null,
            running: false,
            popups: [],

            tafIndex: 0,
            tafTimer: null,
            visibleTafStations: [],

            start(container, data) {
                this.running = true;

                const metars = data.metars;
                const tafs = data.tafs;
                const places = data.places.features;

                const metarMap = new Map(
                    metars.map(s => [s.station_id, s])
                );

                const tafMap = new Map(
                    tafs.map(t => [t.station_id, t])
                );

                this.enrichedPlaces = places
                    .map(p => ({
                        ...p,
                        metar: metarMap.get(p.properties.station_code),
                        taf: tafMap.get(p.properties.station_code)
                    }))
                    .filter(p => p.metar || p.taf);

                this.tafStations = this.enrichedPlaces.filter(p => p.taf);

                this.tafPanel = document.createElement("div");
                this.tafPanel.className = "taf-panel";

                document.getElementById(container).appendChild(this.tafPanel);

                this.map = new maplibregl.Map({
                    container,
                    style: {
                        version: 8,
                        projection: { type: "mercator" },
                        glyphs: "https://jamiefletcher.github.io/weather-bob/assets/fonts/{fontstack}/{range}.pbf",
                        sprite: "https://jamiefletcher.github.io/weather-bob/assets/sprites/sprites-trees",
                        sources: {},
                        layers: [
                            {
                                id: "background",
                                type: "background",
                                paint: { "background-color": "hsl(205, 45%, 78%)" }
                            }
                        ]
                    },
                    hash: true,
                    center: [-79.3832, 43.6532],
                    zoom: 5.9,
                    minZoom: 3,
                    maxZoom: 6.9
                });

                this.map.on("load", () => {

                    this.addSourcesAndLayers();
                    this.addPopups();

                    this.updateVisibleTafStations();
                    this.startTafSequence();

                });

                this.map.on("moveend", () => {
                    this.clearPopups();
                    this.addPopups();

                    this.updateVisibleTafStations();
                    this.hideTafPanel();
                    this.startTafSequence();
                });
            },

            stop() {
                this.running = false;

                if (this.timer) {
                    clearTimeout(this.timer);
                    this.timer = null;
                }

                if (this.map) {
                    this.map.stop();
                    this.map.remove();
                    this.map = null;
                }
            },

            getSafeBounds(pct = 0.1) {
                const canvas = this.map.getCanvas();
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;

                const padX = width * pct;
                const padY = height * pct;

                return {
                    contains: (lngLat) => {
                        const p = this.map.project(lngLat);

                        return (
                            p.x > padX &&
                            p.x < (width - padX) &&
                            p.y > padY &&
                            p.y < (height - padY)
                        );
                    }
                };
            },

            addPopups() {
                const safeBounds = this.getSafeBounds(0.1);

                // 🔴 CRITICAL: clear old popups first
                this.clearPopups();

                this.popups = [];

                this.enrichedPlaces.forEach(f => {
                    const m = f.metar;
                    if (!m) return;

                    const coords = f.geometry.coordinates;
                    if (!safeBounds.contains(coords)) return;

                    const city = f.properties.city;
                    const temp = Math.round(parseFloat(m.temp_c));
                    const skyIcon = decodeSkyConditionSymbol(m.sky_condition);
                    const wxIcon = decodeWxIcon(m.wx_string);

                    const wxBadgeHTML = wxIcon
                        ? `<div class="popup-wx-badge">${wxIcon}</div>`
                        : "";

                    const isLongCity = city.split(" ").some(word => word.length > 10);

                    const popup = new maplibregl.Popup({
                        closeButton: false,
                        closeOnClick: false,
                        anchor: "center",
                        className: isLongCity ? "popup-long-city" : ""
                    })
                        .setLngLat(coords)
                        .setHTML(`
                            <div class="popup-places">
                                ${wxBadgeHTML}

                                <div class="popup-city">
                                    <h2>${city}</h2>
                                </div>

                                <div class="popup-data">
                                    <h1>${temp}°</h1>
                                    <h1>${skyIcon}</h1>
                                </div>

                            </div>
                        `)
                        .addTo(this.map);

                    // force next-frame animation trigger
                    requestAnimationFrame(() => {
                        const el = popup.getElement();
                        if (el) el.classList.add("popup-visible");
                    });

                    this.popups.push(popup);
                });
            },

            clearPopups() {
                if (!this.popups) return;

                this.popups.forEach(p => p.remove());
                this.popups = [];
            },

            startTafSequence() {
                if (this.tafTimer) {
                    clearTimeout(this.tafTimer);
                    this.tafTimer = null;
                }

                this.tafIndex = 0;

                const step = () => {
                    if (!this.running) return;
                    if (!this.visibleTafStations.length) {
                        this.hideTafPanel();
                        return;
                    }

                    const station = this.visibleTafStations[this.tafIndex];

                    if (!station) {
                        this.hideTafPanel();
                        return;
                    }

                    const city = station.properties.city;
                    const taf = station.taf;

                    const html = `
            <div class="taf-city">${city}</div>
            <div class="taf-forecast">
                ${taf.forecast
                            .map(f => `
                        <div class="taf-row">
                            ${f.fcst_time_from?.slice(11, 16)} → ${f.fcst_time_to?.slice(11, 16)}
                            | wind ${f.wind_dir_degrees}° ${f.wind_speed_kt}kt
                            | ${f.sky_condition?.sky_cover ?? ""}
                        </div>
                    `)
                            .join("")}
            </div>
        `;

                    this.tafPanel.style.display = "block";
                    this.tafPanel.innerHTML = html;

                    this.tafIndex++;

                    // last station reached → wait, then hide
                    if (this.tafIndex >= this.visibleTafStations.length) {
                        this.tafTimer = setTimeout(() => {
                            this.hideTafPanel();
                        }, this.STEP_DELAY);

                        return;
                    }

                    this.tafTimer = setTimeout(step, this.STEP_DELAY);
                };

                this.tafTimer = setTimeout(step, this.INITIAL_DELAY);
            },

            hideTafPanel() {
                if (this.tafPanel) {
                    this.tafPanel.style.display = "none";
                    this.tafPanel.innerHTML = "";
                }

                if (this.tafTimer) {
                    clearTimeout(this.tafTimer);
                    this.tafTimer = null;
                }

                this.tafIndex = 0;
            },

            updateVisibleTafStations() {
                const safeBounds = this.getSafeBounds(0.1);

                this.visibleTafStations = this.enrichedPlaces
                    .filter(f => f.taf)
                    .filter(f => safeBounds.contains(f.geometry.coordinates));
            },

            addSourcesAndLayers() {
                this.map.addSource("places", {
                    type: "geojson",
                    data: {
                        type: "FeatureCollection",
                        features: this.enrichedPlaces
                    }
                });

                // this.map.addSource("hillshade", {
                //     type: "vector",
                //     tiles: ["https://jamiefletcher.github.io/weather-bob/data/hillshade/{z}/{x}/{y}.pbf"]
                // });

                this.map.addSource('countries', {
                    type: 'vector',
                    tiles: ["https://jamiefletcher.github.io/weather-bob/data/naturalearth/countries/{z}/{x}/{y}.pbf"]
                });

                this.map.addSource('lakes', {
                    type: 'vector',
                    tiles: ["https://jamiefletcher.github.io/weather-bob/data/naturalearth/lakes/{z}/{x}/{y}.pbf"]
                });

                this.map.addSource('provinces_lines', {
                    type: 'vector',
                    tiles: ["https://jamiefletcher.github.io/weather-bob/data/naturalearth/provinces_lines/{z}/{x}/{y}.pbf"]
                });

                this.map.addSource('coastline', {
                    type: 'vector',
                    tiles: ["https://jamiefletcher.github.io/weather-bob/data/naturalearth/coastline/{z}/{x}/{y}.pbf"]
                });

                this.map.addSource('boundaries', {
                    type: 'vector',
                    tiles: ["https://jamiefletcher.github.io/weather-bob/data/naturalearth/boundaries/{z}/{x}/{y}.pbf"]
                });

                this.map.addSource('roads', {
                    type: 'vector',
                    tiles: ["https://jamiefletcher.github.io/weather-bob/data/naturalearth/roads/{z}/{x}/{y}.pbf"]
                });

                this.map.addSource('rivers', {
                    type: 'vector',
                    tiles: ["https://jamiefletcher.github.io/weather-bob/data/naturalearth/rivers/{z}/{x}/{y}.pbf"]
                });

                this.map.addSource('elevation', {
                    type: 'vector',
                    tiles: ["https://jamiefletcher.github.io/weather-bob/data/naturalearth/elevation/{z}/{x}/{y}.pbf"]
                });

                this.map.addLayer({
                    id: 'countries',
                    source: 'countries',
                    'source-layer': 'countries',
                    type: 'fill',
                    paint: {
                        'fill-color': 'hsl(210, 15%, 92%)'
                    }
                });

                this.map.addLayer({
                    id: 'coastline',
                    source: 'coastline',
                    'source-layer': 'coastline',
                    type: 'line',
                    paint: {
                        'line-color': 'hsl(210, 15%, 72%)',
                        'line-width': 1
                    }
                });

                this.map.addLayer({
                    id: 'rivers',
                    source: 'rivers',
                    'source-layer': 'rivers',
                    type: 'line',
                    paint: {
                        'line-color': 'hsl(205, 45%, 68%)',
                        'line-width': 1
                    }
                });

                this.map.addLayer({
                    id: 'lakes',
                    source: 'lakes',
                    'source-layer': 'lakes',
                    type: 'fill',
                    paint: {
                        'fill-color': 'hsl(205, 45%, 78%)'
                    }
                });

                this.map.addLayer({
                    id: 'lakes-line',
                    source: 'lakes',
                    'source-layer': 'lakes',
                    type: 'line',
                    paint: {
                        'line-color': 'hsl(205, 45%, 68%)',
                        'line-width': 1
                    }
                });

                this.map.addLayer({
                    id: 'roads',
                    source: 'roads',
                    'source-layer': 'roads',
                    type: 'line',
                    filter: ["in", "featurecla", "Road"],
                    paint: {
                        'line-color': 'hsl(210, 15%, 99%)',
                        'line-width': 2
                    }
                });

                this.map.addLayer({
                    id: 'provinces-lines',
                    source: 'provinces_lines',
                    'source-layer': 'provinces_lines',
                    type: 'line',
                    paint: {
                        'line-color': 'hsl(210, 15%, 72%)',
                        'line-width': 2,
                        'line-dasharray': [1, 1]
                    }
                });

                this.map.addLayer({
                    id: 'boundaries',
                    source: 'boundaries',
                    'source-layer': 'boundaries',
                    type: 'line',
                    paint: {
                        'line-color': 'hsl(210, 15%, 72%)',
                        'line-width': 2,
                        'line-dasharray': [2, 1]
                    }
                });

                this.map.addLayer({
                    id: 'elevation',
                    type: 'symbol',
                    source: 'elevation',
                    'source-layer': 'elevation',
                    layout: {
                        'text-field': "▲",
                        'text-size': 24,
                        'text-font': ['montserrat-semibold'],
                        'text-anchor': 'center',
                        'text-allow-overlap': true,
                        'text-ignore-placement': true
                    },
                    paint: {
                        'text-color': 'hsl(135, 35%, 38%)',
                        'text-halo-color': 'hsl(0, 0%, 100%)',
                        'text-halo-width': 0
                    }
                });

                this.map.addLayer({
                    id: 'lakes-labels',
                    type: 'symbol',
                    source: 'lakes',
                    'source-layer': 'lakes',
                    layout: {
                        'text-field': ['get', 'name'],
                        'text-size': 12,
                        'text-max-width': 6,
                        'text-font': ['montserrat-semibold'],
                        'text-anchor': 'center',
                        'text-allow-overlap': false,
                        'text-ignore-placement': false
                    },
                    paint: {
                        'text-color': 'hsl(205, 45%, 48%)',
                        'text-halo-color': 'hsl(0, 0%, 100%)',
                        'text-halo-width': 1
                    }
                });

                // this.map.addLayer({
                //     id: "places",
                //     type: "circle",
                //     source: "places",
                //     paint: {
                //         "circle-radius": 3,
                //         "circle-color": "hsl(0, 0%, 40%)"
                //     }
                // });
            }
        };

        const Scene2 = {
            map: null,
            timer: null,
            running: false,

            // scene-owned constants
            INITIAL_DELAY: 3000,
            PAN_DURATION: 6000,
            STEP_DELAY: 9000,

            GLOBE_STATIONS: [
                ["Toronto", "CYYZ"],
                ["Vancouver", "CYVR"],
                ["Montreal", "CYUL"],
                ["Calgary", "CYYC"],
                ["Edmonton", "CYEG"],
                ["New York", "KJFK"],
                ["Los Angeles", "KLAX"],
                ["Chicago", "KORD"],
                ["San Francisco", "KSFO"],
                ["Miami", "KMIA"],
                ["London", "EGLL"],
                ["Paris", "LFPG"],
                ["Berlin", "EDDB"],
                ["Madrid", "LEMD"],
                ["Rome", "LIRF"],
                ["Tokyo", "RJTT"],
                ["Seoul", "RKSI"],
                ["Beijing", "ZBAA"],
                ["Shanghai", "ZSPD"],
                ["Hong Kong", "VHHH"],
                ["Sydney", "YSSY"],
                ["Melbourne", "YMML"],
                ["Singapore", "WSSS"],
                ["Dubai", "OMDB"],
                ["Istanbul", "LTFM"]
            ],

            start(container, data) {
                this.running = true;

                const metars = data.metars;

                const globeMap = new Map(
                    this.GLOBE_STATIONS.map(([city, code]) => [code, city])
                );

                const globeStations = metars
                    .filter(s => globeMap.has(s.station_id))
                    .map(s => ({
                        ...s,
                        city: globeMap.get(s.station_id)
                    }));

                this.hudContainer = document.getElementById("hud-container");

                this.hud = document.createElement("div");
                this.hud.className = "hud";
                this.hudContainer.appendChild(this.hud);

                const updateHUD = (s) => {
                    const temp = Math.round(parseFloat(s.temp_c));
                    const wxText = decodeWx(s.wx_string);
                    const skyText = decodeSkyCondition(s.sky_condition);

                    this.hud.innerHTML = `
                        <h2>${s.city}</h2>
                        <h1>${temp}°</h1>
                        <h3>${skyText}</h3>
                        <h3>${wxText}</h3>
                    `;
                };

                this.map = new maplibregl.Map({
                    container,
                    style: {
                        version: 8,
                        projection: { type: "globe" },
                        sources: {},
                        layers: []
                    },
                    center: [globeStations[0].longitude, globeStations[0].latitude],
                    zoom: -1
                });

                this.map.on("load", () => {

                    this.map.addSource("naturalearth", {
                        type: "raster",
                        tiles: ["data/naturalearth/raster/{z}/{x}/{y}.png"],
                        tileSize: 256
                    });

                    this.map.addSource("gdps", {
                        type: "raster",
                        tiles: ["data/gdps/tiles/{z}/{x}/{y}.png"],
                        tileSize: 256
                    });

                    this.map.addLayer({
                        id: "naturalearth",
                        type: "raster",
                        source: "naturalearth"
                    });

                    this.map.addLayer({
                        id: "gdps",
                        type: "raster",
                        source: "gdps"
                    });

                    const first = globeStations[0];

                    this.map.jumpTo({
                        center: [first.longitude, first.latitude],
                        zoom: -1
                    });

                    updateHUD(first);

                    this.loop(globeStations, updateHUD);
                });
            },

            loop(metars, updateHUD) {
                const step = () => {
                    if (!this.running || !this.map) return;

                    const s = metars[Math.floor(Math.random() * metars.length)];

                    this.map.easeTo({
                        center: [s.longitude, s.latitude],
                        duration: this.PAN_DURATION
                    });

                    this.map.once("moveend", () => {
                        if (!this.running) return;
                        updateHUD(s);
                    });

                    this.timer = setTimeout(step, this.STEP_DELAY);
                };

                this.timer = setTimeout(step, this.INITIAL_DELAY);
            },

            stop() {
                this.running = false;

                if (this.timer) clearTimeout(this.timer);

                if (this.map) {
                    this.map.stop();
                    this.map.remove();
                    this.map = null;
                }

                if (this.hud) this.hud.remove();
                this.hud = null;
                this.hudContainer = null;
            }
        };

        async function start() {
            const metars = await loadMetars();
            const tafs = await loadTafs();
            const places = await loadStationsPlaces();

            window.__weatherData = {
                metars,
                tafs,
                places
            };

            SceneController.register("scene1", Scene1);
            SceneController.register("scene2", Scene2);

            SceneController.switch("scene1", "map", window.__weatherData);
        }
        start();
    </script>
</body>
