<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Weather Channel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:400,600,900" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">

        <div id="map">
            <div id="hud-container"></div>
        </div>

        <div id="side-panel"></div>

        <div id="bottom-panel"></div>

    </div>

    <script>
        // =========================
        // GLOBAL METAR LOADER (GEOJSON)
        // =========================
        async function loadMetars() {
            const res = await fetch("data/metars/metars.geojson");
            const geojson = await res.json();

            return geojson.features;
        }

        // =========================
        // SCENE CONTROLLER
        // =========================
const sceneController = {
    current: null,

    switch(scene) {
        if (this.current) this.current.stop();

        this.current = scene;
        this.current.start();
    }
};

        // =========================
        // SCENE: CANADA LOOP
        // =========================
const sceneGlobe = {
    map: null,
    running: false,
    timer: null,
    hud: null,
    stations: [],

    async start(container) {
        this.running = true;

        // scene owns its data
        const metars = await loadMetars();

        this.stations = metars.filter(f =>
            f.properties?.iso_country === "CA" &&
            f.geometry?.coordinates?.length === 2
        );

        const first = this.stations[0];
        const [lon, lat] = first.geometry.coordinates;

        // HUD
        const hudContainer = document.getElementById("hud-container");
        this.hud = document.createElement("div");
        this.hud.className = "hud";
        hudContainer.appendChild(this.hud);

        // MAP
        this.map = new maplibregl.Map({
            container: "map",
            style: "green.json",
            center: [lon, lat],
            zoom: 2
        });

        this.map.on("load", () => {
            this.map.addSource("stations", {
                type: "geojson",
                data: {
                    type: "FeatureCollection",
                    features: this.stations
                }
            });

            this.map.addLayer({
                id: "stations",
                type: "circle",
                source: "stations",
                paint: {
                    "circle-radius": 4,
                    "circle-color": "black"
                }
            });

            this.updateHUD(first);
            this.loop();
        });
    },

    updateHUD(f) {
        const p = f.properties;

        this.hud.innerHTML = `
            <h2>${p.station_id}</h2>
            <h1>${Math.round(Number(p.temp_c))}°</h1>
        `;
    },

    loop() {
        const step = () => {
            if (!this.running) return;

            const f = this.stations[Math.floor(Math.random() * this.stations.length)];
            const [lon, lat] = f.geometry.coordinates;

            this.map.easeTo({
                center: [lon, lat],
                duration: 4000
            });

            this.map.once("moveend", () => {
                if (!this.running) return;
                this.updateHUD(f);
            });

            this.timer = setTimeout(step, 5000);
        };

        this.timer = setTimeout(step, 1500);
    },

    stop() {
        this.running = false;

        if (this.timer) clearTimeout(this.timer);

        if (this.map) {
            this.map.remove();
            this.map = null;
        }

        if (this.hud) this.hud.remove();
        this.hud = null;
    }
};

        // =========================
        // START
        // =========================
async function start() {
    await loadMetars();
    sceneController.switch(sceneGlobe);
}

        start();
    </script>
</body>

</html>
