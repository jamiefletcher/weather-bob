<!DOCTYPE html>
<html lang="en">

<head>
    <title>Globe</title>
    <meta property="og:description" content="Globe" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.0.1/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.0.1/dist/maplibre-gl.js'></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            overscroll-behavior-x: none;
            overscroll-behavior-y: none;
        }

        body {
            background-color: hsl(0, 0%, 0%);
            color: hsl(0, 0%, 100%);
            height: 100vh;
            width: 100vw;
            font-family: sans-serif;
            font-size: 16px;
            line-height: 1.3;
        }

        .map-container {
            position: relative;
            display: grid;
            place-items: center;
            height: 100%;
            width: 100%;
            background-image: url('img/bg3.png');
            background-position: center;
            background-size: cover;
        }

        #map {
            width: 330px;
            height: 330px;
            border-radius: 50%;
            border: 3px solid hsl(0, 0%, 90%);
            background-color: hsl(0, 0%, 0%);
            background-position: center;
            background-repeat: no-repeat;
        }

        #info {
            position: absolute;
            top: calc(50% + 180px);
            left: 50%;
            transform: translate(-50%, 0);
        }

        .maplibregl-ctrl-bottom-right {
            display: none;
        }
    </style>
</head>

<body>
    <div class="map-container">
        <div id="map"></div>
        <div id="info"></div>
    </div>

    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                'version': 8,
                'projection': {
                    'type': 'globe'
                },
                'sources': {
                    'countries': {
                        type: 'geojson',
                        data: 'http://localhost:8000/data/world/countries.geojson'
                    },
                    'coastline': {
                        type: 'geojson',
                        data: 'http://localhost:8000/data/world/coastline.geojson'
                    },
                    'boundary_lines': {
                        type: 'geojson',
                        data: 'http://localhost:8000/data/world/boundary_lines.geojson'
                    }
                },
                'layers': [
                    {
                        'id': 'coastline',
                        'type': 'line',
                        'source': 'coastline',
                        'paint': {
                            'line-color': 'hsl(0, 0%, 80%)',
                            'line-width': 2
                        }
                    },
                    {
                        'id': 'boundary_lines',
                        'type': 'line',
                        'source': 'boundary_lines',
                        'paint': {
                            'line-color': 'hsl(0, 0%, 80%)',
                            'line-width': 1
                        }
                    },
                    {
                        'id': 'countries',
                        'type': 'fill',
                        'source': 'countries',
                        'paint': {
                            'fill-color': 'hsl(0, 0%, 100%)',
                            'fill-opacity': 0
                        }
                    }
                ]
            },
            fitBounds: [[-180, -85], [180, 85]],
            center: [78, 26],
            zoom: 1.3,
            minZoom: 1.3
        });
        map.dragRotate.disable();
        map.scrollZoom.disable();

        map.on('load', () => {

            function printCountryAtCenter() {
                const center = map.getCenter();
                const point = map.project(center);

                const features = map.queryRenderedFeatures(point, {
                    layers: ['countries']
                });

                const infoDiv = document.getElementById('info');

                if (features.length > 0) {
                    const props = features[0].properties;
                    const entries = Object.entries(props);

                    // Calculate column widths
                    const keyWidth = Math.max(...entries.map(([k]) => k.length));
                    const valWidth = Math.max(...entries.map(([, v]) => String(v).length));
                    const totalWidth = keyWidth + valWidth + 5;

                    const pad = (str, len) => str.toString().padEnd(len, ' ');

                    let lines = [];
                    lines.push('+' + '-'.repeat(keyWidth + 2) + '+' + '-'.repeat(valWidth + 2) + '+');
                    for (const [key, value] of entries) {
                        lines.push(`| ${pad(key, keyWidth)} | ${pad(value, valWidth)} |`);
                    }
                    lines.push('+' + '-'.repeat(keyWidth + 2) + '+' + '-'.repeat(valWidth + 2) + '+');

                    infoDiv.innerHTML = `<pre style="font-size: 10px; font-family: monospace;">${lines.join('\n')}</pre>`;
                } else {
                    infoDiv.textContent = 'No country at center';
                }
            }

            //map.on('moveend', printCountryAtCenter);
            //printCountryAtCenter(); // initial print

        });




    </script>

</body>

</html>
