<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Weather Channel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:400,600,900" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Libre+Baskerville:wght@400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">

        <div id="title-container"></div>

        <div id="map">
            <div id="hud-container"></div>
        </div>

        <div id="side-panel"></div>

        <div id="bottom-panel"></div>

    </div>

    <script>
        // =========================
        // LOAD METARS
        // =========================
        let METARS = null;

        async function getMetars() {
            if (METARS) return METARS;

            const res = await fetch("data/metars/metars_places_airports.geojson");
            METARS = await res.json();

            return METARS;
        }

        // =========================
        // SCENE CONTROLLER
        // =========================
        const sceneController = {
            current: null,

            switch(scene) {
                if (this.current) this.current.stop();

                this.current = scene;
                this.current.start();
            }
        };

        // =========================
        // TIMER CONTROLLER
        // =========================
        function createTimerManager() {
            const timers = new Set();

            return {
                set(fn, delay) {
                    const id = setTimeout(() => {
                        timers.delete(id);
                        fn();
                    }, delay);

                    timers.add(id);
                    return id;
                },

                clear(id) {
                    clearTimeout(id);
                    timers.delete(id);
                },

                clearAll() {
                    for (const id of timers) {
                        clearTimeout(id);
                    }
                    timers.clear();
                }
            };
        }

// =========================
// TITLES
// =========================
window.setTitle = (className, label) => {
    const container = document.getElementById("title-container");
    if (!container) return;

    let target = container.querySelector(`.${className}`);

    // create if missing
    if (!target) {
        target = document.createElement("div");
        target.className = className;
        container.appendChild(target);
    }

    target.textContent = label;
};

        // =========================
        // SCENE: CANADA LOOP
        // =========================
        const sceneCanada = {
            INITIAL_DELAY: 5000,
            STEP_DELAY: 5000,
            map: null,
            running: false,
            timer: null,
            popups: [],
            timer: createTimerManager(),
            dataLabel: "",
            layerLabel: "",

            async start(container) {
                this.running = true;

                const data = await getMetars();
                
                const features = data.features
                    .filter(f => f.properties.iso_country === "CA")
                    .filter(f => ["large_airport", "medium_airport"].includes(f.properties.airport_type));

                const [lon, lat] = features[0].geometry.coordinates;

                this.map = new maplibregl.Map({
                    container: "map",
                    style: "naturalearth.json",
                    center: [lon, lat],
                    zoom: 5.5,
                    minZoom: 3,
                    maxZoom: 6.9,
                    hash: true
                });

                this.map.on("load", () => {
                    this.addLayers(features);
                    this.addPopups(features);
                    this.loop(features);
                });

                this.map.on("moveend", () => {
                    this.addPopups(features);
                });
            },

            addLayers(features) {
                this.map.addSource("stations", {
                    type: "geojson",
                    data: {
                        type: "FeatureCollection",
                        features: features
                    }
                });

                this.map.addLayer({
                    id: "stations",
                    type: "circle",
                    source: "stations",
                    paint: {
                        "circle-radius": 4,
                        "circle-color": "black"
                    }
                });
            },

            getSafeBounds(pct = 0.1) {
                const canvas = this.map.getCanvas();
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;

                const padX = width * pct;
                const padY = height * pct;

                return {
                    contains: (lngLat) => {
                        const p = this.map.project(lngLat);

                        return (
                            p.x > padX &&
                            p.x < (width - padX) &&
                            p.y > padY &&
                            p.y < (height - padY)
                        );
                    }
                };
            },

            addPopups(features) {
                const safeBounds = this.getSafeBounds(0.1);

                this.clearPopups();
                this.popups = [];

                features.forEach(f => {
                    const coords = f.geometry.coordinates;
                    const p = f.properties;

                    if (!safeBounds.contains(coords)) return;

                    const temp = Math.round(Number(p.temp_c));
                    const city = p.name || p.icao_code || "";
                    const skyIcon = decodeSkyConditionIcon(p.sky_condition);
                    const wxIcon = decodeWxIcon(p.wx_string);

                    const wxBadgeHTML = wxIcon
                        ? `<div class="popup-wx-badge">${wxIcon}</div>`
                        : "";

                    const isLongCity = city.split(" ").some(w => w.length > 10);

                    const popup = new maplibregl.Popup({
                        closeButton: false,
                        closeOnClick: false,
                        anchor: "center",
                        className: isLongCity ? "popup-long-city" : ""
                    })
                        .setLngLat(coords)
                        .setHTML(`
                            <div class="popup-places">
                                ${wxBadgeHTML}
                                <div class="popup-city">
                                    <h2>${city}</h2>
                                </div>
                                <div class="popup-data">
                                    <h1>${temp}°</h1>
                                    <h1>${skyIcon}</h1>
                                </div>
                            </div>
                        `)
                        .addTo(this.map);

                    this.timer.set(() => {
                        const el = popup.getElement();
                        if (el) el.classList.add("popup-visible");
                    }, 0);

                    this.popups.push(popup);
                });
            },

            clearPopups() {
                if (!this.popups) return;

                const EXIT_TIME = 280;

                this.popups.forEach(p => {
                    const el = p.getElement();

                    if (el) {
                        el.classList.remove("popup-visible");
                        el.classList.add("popup-hidden");
                    }

                    this.timer.set(() => {
                        p.remove();
                    }, EXIT_TIME);
                });

                this.popups = [];
            },

            loop(features) {
                const step = () => {
                    if (!this.running) return;

                    const f = features[Math.floor(Math.random() * features.length)];
                    const [lon, lat] = f.geometry.coordinates;

                    this.clearPopups();

                    this.map.jumpTo({
                        center: [lon, lat]
                    });

                    this.map.once("moveend", () => {
                        if (!this.running) return;
                        this.addPopups(features);
                    });

                    this.timer.set(step, this.STEP_DELAY);
                };

                this.timer.set(step, this.INITIAL_DELAY);
            },

            stop() {
                this.running = false;

                this.timer.clearAll();

                if (this.map) {
                    this.map.remove();
                    this.map = null;
                }
            }
        };

        // =========================
        // SCENE: GLOBE LOOP
        // =========================
        const sceneGlobe = {
            PAN_DURATION: 4000,
            INITIAL_DELAY: 1000,
            STEP_DELAY: 5000,
            map: null,
            running: false,
            timer: null,
            hud: null,
            timer: createTimerManager(),

            async start(container) {
this.running = true;

const data = await getMetars();

const features = data.features
    .filter(f => f.properties.adm0cap === 1)
    .sort((a, b) =>
        a.geometry.coordinates[0] - b.geometry.coordinates[0]
    );

const first = features[0];
const [lon, lat] = first.geometry.coordinates;

                // HUD-LEFT
                const hudContainer = document.getElementById("hud-container");
                this.hud = document.createElement("div");
                this.hud.className = "hud-left";
                hudContainer.appendChild(this.hud);

                // MAP
                this.map = new maplibregl.Map({
                    container: "map",
                    style: "gdps.json",
                    center: [lon, lat],
                    zoom: 2,
                    pitch: 0,
                    hash: false
                });

                this.map.on("load", () => {
                    this.addLayers(features);
                    this.updateHUD(first);
                    this.loop(features);
                });
            },

            addLayers(features) {
                this.map.addSource("stations", {
                    type: "geojson",
                    data: {
                        type: "FeatureCollection",
                        features: features
                    }
                });

                this.map.addLayer({
                    id: "stations",
                    type: "circle",
                    source: "stations",
                    paint: {
                        "circle-radius": 4,
                        "circle-color": "black"
                    }
                });
            },

updateHUD(f) {
    const p = f.properties;

    const skyText = decodeSkyCondition(p.sky_condition);
    const wxText = decodeWx(p.wx_string);

    const temp = Number(p.temp_c);
    const tempDisplay = Number.isFinite(temp)
        ? `${Math.round(temp)}°`
        : "--";

    this.hud.innerHTML = `
        <div class="hud-item">
            <h2>${p.name || p.icao_code}</h2>
            ${p.adm1name ? `<h2>${p.adm1name}</h2>` : ""}
            ${p.adm0name ? `<h2>${p.adm0name}</h2>` : ""}
        </div>
        <div class="hud-item">
            <h1>${tempDisplay}</h1>
        </div>
        <div class="hud-item">
            <h1>${skyText || ""}</h1>
        </div>
        <div class="hud-item">
            <h2>${wxText || ""}</h2>
        </div>
    `;
},

loop(features) {
    let i = 1;

    const step = () => {
        if (!this.running) return;

        const f = features[i % features.length];
        i++;

        const [lon, lat] = f.geometry.coordinates;

        this.map.easeTo({
            center: [lon, lat],
            duration: this.PAN_DURATION
        });

        this.map.once("moveend", () => {
            if (!this.running) return;
            this.updateHUD(f);
        });

        this.timer.set(step, this.STEP_DELAY);
    };

    this.timer.set(step, this.INITIAL_DELAY);
},

            stop() {
                this.running = false;

                this.timer.clearAll();

                if (this.map) {
                    this.map.remove();
                    this.map = null;
                }

                if (this.hud) this.hud.remove();
                this.hud = null;
            }
        };

        // =========================
        // START
        // =========================
        async function start() {
            sceneController.switch(sceneGlobe);
        }

        start();

        // =========================
        // HELPER FUNCTIONS
        // =========================
        function shuffle(a) {
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function formatTime(t) {
            if (!t || typeof t !== "string") return null;
            return t.length >= 16 ? t.slice(11, 16) : null;
        }

        function formatWind(dir, speed, gust) {
            if (dir == null && speed == null) return null;

            let d;

            if (dir === "VRB") {
                d = "VRB";
            } else if (Number.isFinite(Number(dir))) {
                d = `${Number(dir).toString().padStart(3, "0")}°`;
            }

            const s = Number.isFinite(Number(speed)) ? `${Number(speed)}kt` : "";
            const g = Number.isFinite(Number(gust)) ? `G${Number(gust)}` : "";

            return [d, s + g].filter(Boolean).join(" ");
        }

        function decodeWindIcon(dir) {
            if (!dir) return "";

            if (dir === "VRB") return "🔀"; // variable wind

            const d = Number(dir);
            if (!Number.isFinite(d)) return "";

            // 8-point compass
            const sectors = [
                { max: 22.5, icon: "⬆️" },   // N
                { max: 67.5, icon: "↗️" },   // NE
                { max: 112.5, icon: "➡️" },  // E
                { max: 157.5, icon: "↘️" },  // SE
                { max: 202.5, icon: "⬇️" },  // S
                { max: 247.5, icon: "↙️" },  // SW
                { max: 292.5, icon: "⬅️" },  // W
                { max: 337.5, icon: "↖️" },  // NW
                { max: 360, icon: "⬆️" }     // N wrap
            ];

            return sectors.find(s => d <= s.max)?.icon || "";
        }

        function decodeWx(wx) {
            if (!wx) return "";

            const INTENSITY = {
                "-": "Light",
                "+": "Heavy",
                "VC": "Nearby"
            };

            const DESCRIPTOR = {
                "MI": "Shallow",
                "PR": "Partial",
                "BC": "Patches",
                "DR": "Drifting",
                "BL": "Blowing",
                "SH": "Showers",
                "TS": "Thunderstorm",
                "FZ": "Freezing"
            };

            const PHENOMENA = {
                "RA": "Rain",
                "DZ": "Drizzle",
                "SN": "Snow",
                "SG": "Snow Grains",
                "IC": "Ice Crystals",
                "PL": "Ice Pellets",
                "GR": "Hail",
                "GS": "Graupel",
                "UP": "Unknown Precip",
                "FG": "Fog",
                "VA": "Ash",
                "BR": "Mist",
                "HZ": "Haze",
                "DU": "Dust",
                "FU": "Smoke",
                "SA": "Sand",
                "PY": "Spray",
                "SQ": "Squall",
                "PO": "Dust Whirls",
                "DS": "Duststorm",
                "SS": "Sandstorm",
                "FC": "Funnel Cloud"
            };

            return wx.trim().split(/\s+/).map(token => {
                let intensity = "";
                let descriptor = "";
                let phenomenon = "";

                // intensity
                if (token.startsWith("VC")) {
                    intensity = INTENSITY["VC"];
                    token = token.slice(2);
                } else if (token.startsWith("-") || token.startsWith("+")) {
                    intensity = INTENSITY[token[0]];
                    token = token.slice(1);
                }

                // descriptor (2-letter prefix)
                const desc = token.slice(0, 2);
                if (DESCRIPTOR[desc]) {
                    descriptor = DESCRIPTOR[desc];
                    token = token.slice(2);
                }

                // remaining = phenomenon
                phenomenon = PHENOMENA[token] || token;

                return [intensity, descriptor, phenomenon]
                    .filter(Boolean)
                    .join(" ");
            }).join(", ");
        }

        function decodeWxIcon(wx) {
            if (!wx) return "";

            const RAIN = new Set(["RA", "DZ"]);
            const SNOW = new Set(["SN", "SG", "GR", "GS", "PL"]);
            const STORM = new Set(["TS"]);

            const seen = new Set();

            return wx.trim()
                .split(/\s+/)
                .map(token => {
                    token = token.replace(/^[-+]/, "");
                    const code = token.slice(0, 2);

                    let icon = ""; // default fallback (no clouds)

                    if (STORM.has(code)) icon = "⚡";
                    else if (RAIN.has(code)) icon = "💧";
                    else if (SNOW.has(code)) icon = "❄️";

                    return icon;
                })
                .filter(icon => {
                    if (!icon) return false;
                    if (seen.has(icon)) return false;
                    seen.add(icon);
                    return true;
                })
                .join(" ");
        }

        function decodeSkyCondition(sky) {
            if (!sky) return "";

            const COVER = {
                "SKC": "Clear",
                "CLR": "Clear",
                "NSC": "Clear",
                "FEW": "Partly Cloudy",
                "SCT": "Partly Cloudy",
                "BKN": "Mostly Cloudy",
                "OVC": "Overcast",
                "VV": "Obscured"
            };

            const layers = Array.isArray(sky) ? sky : [sky];
            const top = layers[0]; // dominant / lowest layer is most relevant visually

            if (!top || !top.sky_cover) return "Clear";

            return COVER[top.sky_cover] || "Cloudy";
        }

        function decodeSkyConditionIcon(sky) {
            if (!sky) return "☀️";

            const SYMBOL = {
                "SKC": "☀️",
                "CLR": "☀️",
                "NSC": "🌤️",
                "FEW": "🌤️",
                "SCT": "⛅",
                "BKN": "☁️",
                "OVC": "☁️",
                "VV": "🌫️"
            };

            const layers = Array.isArray(sky) ? sky : [sky];
            const top = layers[0];

            if (!top || !top.sky_cover) return "☀️";

            return SYMBOL[top.sky_cover] || "☁️";
        }

    </script>
</body>

</html>
