<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Weather Channel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:400,600,900" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            line-height: 1;
            font-family: 'Lato', sans-serif;
            font-size: clamp(12px, 1vw, 90px);
            color: hsl(0, 0%, 40%);
        }

        .app {
            height: 100%;
            width: 100%;

            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr clamp(140px, 20vh, 260px);

            grid-template-areas:
                "map"
                "bottom";
        }

        /*
        .app {
            height: 100%;
            width: 100%;

            display: grid;
            grid-template-columns: 1fr clamp(240px, 25vw, 400px);
            grid-template-rows: 1fr clamp(140px, 20vh, 260px);

            grid-template-areas:
                "map side"
                "bottom bottom";
        }
*/

        #map {
            grid-area: map;
            position: relative;
        }

        #hud-container {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;

            width: 100%;
            height: 100%;

            pointer-events: none;

            display: flex;
            align-items: flex-start;
            justify-content: flex-start;

            padding: 2rem;
        }

        .hud {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);

            padding: 1.2rem 1.4rem;
            border-radius: 14px;

            max-width: 320px;

            color: white;

            display: flex;
            flex-direction: column;
            gap: 0.3rem;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);

            padding: 1.2rem 1.4rem;
            border-radius: 14px;

            max-width: 320px;

            color: white;

            display: flex;
            flex-direction: column;
            gap: 0.3rem;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        #side-panel {
            grid-area: side;
            overflow: hidden;
            background: hsl(0, 0%, 30%);
            color: white;
        }

        #bottom-panel {
            grid-area: bottom;
            overflow: hidden;
            background: hsl(0, 0%, 98%);
        }

        .popup-places {
            border: 1px solid hsl(0, 0%, 100%);
            border-radius: 5px;
            line-height: 1;
            background-color: hsl(270, 35%, 100%);
            color: hsl(270, 35%, 20%);
            box-shadow: 2px 2px 2px hsla(0, 0%, 0%, 0.1);
        }

        .popup-city {
            background-color: hsl(270, 35%, 20%);
            color: hsl(270, 35%, 100%);
            border-radius: 5px 5px 0 0;
            padding: 5px;
        }

        .popup-data {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: left;
            gap: 0.1rem;
            padding: 5px;
        }

        .popup-places h1 {
            font-size: 1.2rem;
        }

        .popup-places h2 {
            font-size: 0.8rem;
        }

        .popup-places h3 {
            font-size: 0.1rem;
        }

        .maplibregl-popup-tip .popup-places {
            border-color: hsla(270, 35%, 100%, 0);
        }

        #map>.maplibregl-canvas-container,
        #map canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .maplibregl-ctrl-bottom-right {
            display: none;
        }

        .maplibregl-popup-content {
            padding: 0 !important;
            background: transparent;
            box-shadow: none;
        }

        .maplibregl-popup,
        .maplibregl-popup * {
            pointer-events: none;
            user-select: none;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 400;
        }

        h3 {
            font-size: 1.2rem;
            font-weight: 400;
        }

        h4 {
            font-size: 1rem;
            font-weight: 300;
        }

        @media (min-width: 1024px) {}
    </style>
</head>

<body>
    <div class="app">

        <div id="map">
            <div id="hud-container"></div>
        </div>

        <div id="side-panel"></div>

        <div id="bottom-panel"></div>

    </div>
    <script>
        // =========================
        // LOAD METARS
        // =========================
        async function loadMetars() {
            const res = await fetch('data/metars/metars.cache.xml');
            const text = await res.text();

            const xml = new DOMParser().parseFromString(text, 'application/xml');
            const metarNodes = Array.from(xml.getElementsByTagName('METAR'));
console.log(text)
            return metarNodes
                .map(node => {
                    const row = {};

                    Array.from(node.children).forEach(child => {
                        const key = child.tagName;

                        if (row[key]) {
                            if (!Array.isArray(row[key])) row[key] = [row[key]];
                            row[key].push(parseNode(child));
                        } else {
                            row[key] = parseNode(child);
                        }
                    });

                    const station_id = row.station_id;
                    const lat = parseFloat(row.latitude);
                    const lon = parseFloat(row.longitude);

                    // only reject totally unusable records
                    if (!station_id || !Number.isFinite(lat) || !Number.isFinite(lon)) {
                        return null;
                    }

                    return {
                        ...row,
                        station_id,
                        latitude: lat,
                        longitude: lon
                    };
                })
                .filter(Boolean);
        }

        // =========================
        // LOAD STATIONS PLACES
        // =========================
        async function loadStationsPlaces() {
            const res = await fetch('data/stations_places.geojson');
            const geojson = await res.json();

            if (!geojson || !geojson.features) {
                return { type: "FeatureCollection", features: [] };
            }

            return geojson;
        }

        // helper functions
        function parseNode(node) {
            const hasAttributes = node.attributes.length > 0;

            // if no attributes, just return text
            if (!hasAttributes) return node.textContent;

            // otherwise return object with attributes + value
            const obj = {};

            Array.from(node.attributes).forEach(attr => {
                obj[attr.name] = attr.value;
            });

            if (node.textContent.trim()) {
                obj.value = node.textContent;
            }

            return obj;
        }

        function shuffle(a) {
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function decodeWx(wx) {
            if (!wx) return "";

            const INTENSITY = {
                "-": "Light",
                "+": "Heavy",
                "VC": "Nearby"
            };

            const DESCRIPTOR = {
                "MI": "Shallow",
                "PR": "Partial",
                "BC": "Patches",
                "DR": "Drifting",
                "BL": "Blowing",
                "SH": "Showers",
                "TS": "Thunderstorm",
                "FZ": "Freezing"
            };

            const PHENOMENA = {
                "RA": "Rain",
                "DZ": "Drizzle",
                "SN": "Snow",
                "SG": "Snow Grains",
                "IC": "Ice Crystals",
                "PL": "Ice Pellets",
                "GR": "Hail",
                "GS": "Graupel",
                "UP": "Unknown Precip",
                "FG": "Fog",
                "VA": "Ash",
                "BR": "Mist",
                "HZ": "Haze",
                "DU": "Dust",
                "FU": "Smoke",
                "SA": "Sand",
                "PY": "Spray",
                "SQ": "Squall",
                "PO": "Dust Whirls",
                "DS": "Duststorm",
                "SS": "Sandstorm",
                "FC": "Funnel Cloud"
            };

            return wx.trim().split(/\s+/).map(token => {
                let intensity = "";
                let descriptor = "";
                let phenomenon = "";

                // intensity
                if (token.startsWith("VC")) {
                    intensity = INTENSITY["VC"];
                    token = token.slice(2);
                } else if (token.startsWith("-") || token.startsWith("+")) {
                    intensity = INTENSITY[token[0]];
                    token = token.slice(1);
                }

                // descriptor (2-letter prefix)
                const desc = token.slice(0, 2);
                if (DESCRIPTOR[desc]) {
                    descriptor = DESCRIPTOR[desc];
                    token = token.slice(2);
                }

                // remaining = phenomenon
                phenomenon = PHENOMENA[token] || token;

                return [intensity, descriptor, phenomenon]
                    .filter(Boolean)
                    .join(" ");
            }).join(", ");
        }

        function decodeSkyCondition(sky) {
            if (!sky) return "";

            const COVER = {
                "SKC": "Clear",
                "CLR": "Clear",
                "NSC": "Clear",
                "FEW": "Partly Cloudy",
                "SCT": "Partly Cloudy",
                "BKN": "Mostly Cloudy",
                "OVC": "Overcast",
                "VV": "Obscured"
            };

            const layers = Array.isArray(sky) ? sky : [sky];
            const top = layers[0]; // dominant / lowest layer is most relevant visually

            if (!top || !top.sky_cover) return "Clear";

            return COVER[top.sky_cover] || "Cloudy";
        }

        function decodeSkyConditionSymbol(sky) {
            if (!sky) return "☀️";

            const SYMBOL = {
                "SKC": "☀️",
                "CLR": "☀️",
                "NSC": "🌤️",
                "FEW": "🌤️",
                "SCT": "⛅",
                "BKN": "☁️",
                "OVC": "☁️",
                "VV": "🌫️"
            };

            const layers = Array.isArray(sky) ? sky : [sky];
            const top = layers[0];

            if (!top || !top.sky_cover) return "☀️";

            return SYMBOL[top.sky_cover] || "☁️";
        }

        const SceneController = {
            current: null,
            scenes: {},

            register(name, scene) {
                this.scenes[name] = scene;
            },

            switch(name, container, data) {
                if (this.current) {
                    this.current.stop();
                    this.current = null;
                }

                const next = this.scenes[name];
                if (!next) return false;

                this.current = next;
                next.start(container, data);

                return true;
            }
        };

        window.SceneController = SceneController;

        const Scene1 = {
            map: null,
            timer: null,
            running: false,
            popups: [],

            start(container, data) {
                this.running = true;

                const stations = data.stations;
                const places = data.places.features;

                const metarMap = new Map(
                    stations.map(s => [s.station_id, s])
                );

                this.enrichedPlaces = places
                    .map(p => ({
                        ...p,
                        metar: metarMap.get(p.properties.station_code)
                    }))
                    .filter(p => p.metar);

                this.map = new maplibregl.Map({
                    container,
                    style: {
                        version: 8,
                        projection: { type: "mercator" },
                        glyphs: "https://geographyclub.github.io/toronto-map/assets/fonts/{fontstack}/{range}.pbf",
                        sprite: "https://geographyclub.github.io/toronto-map/assets/sprites/sprites-trees",
                        sources: {},
                        layers: [
                            {
                                id: "background",
                                type: "background",
                                paint: { "background-color": "#8ddbf6" }
                            }
                        ]
                    },
                    hash: false,
                    center: [-79.3832, 43.6532],
                    zoom: 5.9,
                    minZoom: 3,
                    maxZoom: 6.9
                });

                this.map.on("load", () => {

                    this.addSourcesAndLayers();
                    this.addPopups();
                    this.loop(stations);
                });

                this.map.on("moveend", () => {
                    this.clearPopups();
                    this.addPopups();
                });
            },

            addSourcesAndLayers() {
                this.map.addSource("places", {
                    type: "geojson",
                    data: {
                        type: "FeatureCollection",
                        features: this.enrichedPlaces
                    }
                });

                this.map.addSource('countries', {
                    type: 'vector',
                    tiles: ["https://jamiefletcher.github.io/weather-bob/data/naturalearth/countries/{z}/{x}/{y}.pbf"]
                });

                this.map.addSource('lakes', {
                    type: 'vector',
                    tiles: ["https://jamiefletcher.github.io/weather-bob/data/naturalearth/lakes/{z}/{x}/{y}.pbf"]
                });

                this.map.addSource('provinces_lines', {
                    type: 'vector',
                    tiles: ["https://jamiefletcher.github.io/weather-bob/data/naturalearth/provinces_lines/{z}/{x}/{y}.pbf"]
                });

                this.map.addSource('roads', {
                    type: 'vector',
                    tiles: ["https://jamiefletcher.github.io/weather-bob/data/naturalearth/roads/{z}/{x}/{y}.pbf"]
                });

                this.map.addLayer({
                    id: 'countries',
                    source: 'countries',
                    'source-layer': 'countries',
                    type: 'fill',
                    paint: {
                        'fill-color': 'hsl(93, 47%, 76%)'
                    }
                });

                this.map.addLayer({
                    id: 'countries-lines',
                    source: 'countries',
                    'source-layer': 'countries',
                    type: 'line',
                    paint: {
                        'line-color': 'hsl(0, 0%, 100%)',
                        'line-width': 2
                    }
                });

                this.map.addLayer({
                    id: 'provinces-lines',
                    source: 'provinces_lines',
                    'source-layer': 'provinces_lines',
                    type: 'line',
                    paint: {
                        'line-color': 'hsl(0, 0%, 100%)',
                        'line-width': 2,
                        'line-dasharray': [2, 2]
                    }
                });

                this.map.addLayer({
                    id: 'lakes',
                    source: 'lakes',
                    'source-layer': 'lakes',
                    type: 'fill',
                    paint: {
                        'fill-color': 'hsl(197, 85%, 75%)'
                    }
                });

                this.map.addLayer({
                    id: 'lakes-line',
                    source: 'lakes',
                    'source-layer': 'lakes',
                    type: 'line',
                    paint: {
                        'line-color': 'hsl(0, 0%, 100%)',
                        'line-width': 1
                    }
                });

                this.map.addLayer({
                    id: 'roads',
                    source: 'roads',
                    'source-layer': 'roads',
                    type: 'line',
                    paint: {
                        'line-color': 'hsl(93, 47%, 96%)',
                        'line-width': 1
                    }
                });

                // this.map.addLayer({
                //     id: "places",
                //     type: "circle",
                //     source: "places",
                //     paint: {
                //         "circle-radius": 6,
                //         "circle-color": "hsl(0, 0%, 0%)"
                //     }
                // });
            },

            getSafeBounds(pct = 0.1) {
                const canvas = this.map.getCanvas();
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;

                const padX = width * pct;
                const padY = height * pct;

                return {
                    contains: (lngLat) => {
                        const p = this.map.project(lngLat);

                        return (
                            p.x > padX &&
                            p.x < (width - padX) &&
                            p.y > padY &&
                            p.y < (height - padY)
                        );
                    }
                };
            },

            addPopups() {
                const safeBounds = this.getSafeBounds(0.1);

                // 🔴 CRITICAL: clear old popups first
                this.clearPopups();

                this.popups = [];

                this.enrichedPlaces.forEach(f => {
                    const m = f.metar;
                    if (!m) return;

                    const coords = f.geometry.coordinates;
                    if (!safeBounds.contains(coords)) return;

                    const city = f.properties.city;
                    const temp = Math.round(parseFloat(m.temp_c));
                    const skyIcon = decodeSkyConditionSymbol(m.sky_condition);

                    const popup = new maplibregl.Popup({
                        closeButton: false,
                        closeOnClick: false,
                        anchor: "center"
                    })
                        .setLngLat(coords)
                        .setHTML(`
                            <div class="popup-places">
                                <div class="popup-city">
                                    <h2>${city}</h2>
                                </div>
                                <div class="popup-data">
                                    <h1>${temp}°</h1>
                                    <h1>${skyIcon}</h1>
                                </div>
                            </div>
                        `)
                        .addTo(this.map);

                    this.popups.push(popup);
                });
            },

            clearPopups() {
                if (!this.popups) return;

                this.popups.forEach(p => p.remove());
                this.popups = [];
            },

            loop() {
                // intentionally empty for now
                // (Scene2 has animation loop; Scene1 will get one later)
            },

            stop() {
                this.running = false;

                if (this.timer) {
                    clearTimeout(this.timer);
                    this.timer = null;
                }

                if (this.map) {
                    this.map.stop();
                    this.map.remove();
                    this.map = null;
                }
            }
        };

        const Scene2 = {
            map: null,
            timer: null,
            running: false,

            // scene-owned constants
            INITIAL_DELAY: 3000,
            PAN_DURATION: 6000,
            STEP_DELAY: 9000,

            GLOBE_STATIONS: [
                ["Toronto", "CYYZ"],
                ["Vancouver", "CYVR"],
                ["Montreal", "CYUL"],
                ["Calgary", "CYYC"],
                ["Edmonton", "CYEG"],
                ["New York", "KJFK"],
                ["Los Angeles", "KLAX"],
                ["Chicago", "KORD"],
                ["San Francisco", "KSFO"],
                ["Miami", "KMIA"],
                ["London", "EGLL"],
                ["Paris", "LFPG"],
                ["Berlin", "EDDB"],
                ["Madrid", "LEMD"],
                ["Rome", "LIRF"],
                ["Tokyo", "RJTT"],
                ["Seoul", "RKSI"],
                ["Beijing", "ZBAA"],
                ["Shanghai", "ZSPD"],
                ["Hong Kong", "VHHH"],
                ["Sydney", "YSSY"],
                ["Melbourne", "YMML"],
                ["Singapore", "WSSS"],
                ["Dubai", "OMDB"],
                ["Istanbul", "LTFM"]
            ],

            start(container, data) {
                this.running = true;

                const stations = data.stations;

                const globeMap = new Map(
                    this.GLOBE_STATIONS.map(([city, code]) => [code, city])
                );

                const globeStations = stations
                    .filter(s => globeMap.has(s.station_id))
                    .map(s => ({
                        ...s,
                        city: globeMap.get(s.station_id)
                    }));

                this.hudContainer = document.getElementById("hud-container");

                this.hud = document.createElement("div");
                this.hud.className = "hud";
                this.hudContainer.appendChild(this.hud);

                const updateHUD = (s) => {
                    const temp = Math.round(parseFloat(s.temp_c));
                    const wxText = decodeWx(s.wx_string);
                    const skyText = decodeSkyCondition(s.sky_condition);

                    this.hud.innerHTML = `
                        <h2>${s.city}</h2>
                        <h1>${temp}°</h1>
                        <h3>${skyText}</h3>
                        <h3>${wxText}</h3>
                    `;
                };

                this.map = new maplibregl.Map({
                    container,
                    style: {
                        version: 8,
                        projection: { type: "globe" },
                        sources: {},
                        layers: []
                    },
                    center: [globeStations[0].longitude, globeStations[0].latitude],
                    zoom: -1
                });

                this.map.on("load", () => {

                    this.map.addSource("naturalearth", {
                        type: "raster",
                        tiles: ["data/naturalearth/raster/{z}/{x}/{y}.png"],
                        tileSize: 256
                    });

                    this.map.addSource("gdps", {
                        type: "raster",
                        tiles: ["data/gdps/tiles/{z}/{x}/{y}.png"],
                        tileSize: 256
                    });

                    this.map.addLayer({
                        id: "naturalearth",
                        type: "raster",
                        source: "naturalearth"
                    });

                    this.map.addLayer({
                        id: "gdps",
                        type: "raster",
                        source: "gdps"
                    });

                    const first = globeStations[0];

                    this.map.jumpTo({
                        center: [first.longitude, first.latitude],
                        zoom: -1
                    });

                    updateHUD(first);

                    this.loop(globeStations, updateHUD);
                });
            },

            loop(stations, updateHUD) {
                const step = () => {
                    if (!this.running || !this.map) return;

                    const s = stations[Math.floor(Math.random() * stations.length)];

                    this.map.easeTo({
                        center: [s.longitude, s.latitude],
                        duration: this.PAN_DURATION
                    });

                    this.map.once("moveend", () => {
                        if (!this.running) return;
                        updateHUD(s);
                    });

                    this.timer = setTimeout(step, this.STEP_DELAY);
                };

                this.timer = setTimeout(step, this.INITIAL_DELAY);
            },

            stop() {
                this.running = false;

                if (this.timer) clearTimeout(this.timer);

                if (this.map) {
                    this.map.stop();
                    this.map.remove();
                    this.map = null;
                }

                if (this.hud) this.hud.remove();
                this.hud = null;
                this.hudContainer = null;
            }
        };

        async function start() {

            const stations = await loadMetars();
            const places = await loadStationsPlaces();

            window.__weatherData = {
                stations,
                places
            };

            SceneController.register("scene1", Scene1);
            SceneController.register("scene2", Scene2);

            SceneController.switch("scene1", "map", window.__weatherData);
        }
        start();
    </script>
</body>

</html>
