<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Weather Channel</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Lato', sans-serif;
    color: hsl(0, 0%, 40%);
}

html, body {
    height: 100%;
    width: 100%;
    line-height: 0.9;
}

.container {
    height: 100%;
    width: 100%;
    padding: 20px;
}

#map-container {
    position: relative;
    height: 50%;
    overflow: hidden;
    border-radius: 10px;
    background: radial-gradient(
        circle at 50% 100%,
        hsl(210, 100%, 85%) 0%,
        hsl(210, 100%, 95%) 30%,
        hsl(210, 100%, 100%) 60%,
        transparent 80%
    );
}

#map {
    position: absolute;
    inset: 0;
    top: 50%;
    height: 100%;
    opacity: 0;
    transition: opacity 500ms ease;
}

#hud {
    display: flex;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
}

#hud-left,
#hud-right {
    flex: 1;
    position: relative;
}

.maplibregl-ctrl-bottom-right {
    display: none;
}

h1 {
    font-size: 90px;
    font-weight: 300;
    letter-spacing: -5px;
}

h2 {
    font-weight: 400;
}

</style>
</head>

<body>
<div class="container">
    <div id="map-container">

        <div id="hud">
            <div id="hud-left">
                <div id="hud-city"></div>
                <div id="hud-temp"></div>
            </div>
            <div id="hud-right"></div>
        </div>

        <div id="map"></div>

    </div>
</div>

<script>
// =========================
// CITY DATA
// =========================
const CITY_STATIONS = [
    ["Toronto", "CYYZ"],
    ["Vancouver", "CYVR"],
    ["Montreal", "CYUL"],
    ["Calgary", "CYYC"],
    ["Edmonton", "CYEG"],
    ["New York", "KJFK"],
    ["Los Angeles", "KLAX"],
    ["Chicago", "KORD"],
    ["San Francisco", "KSFO"],
    ["Miami", "KMIA"],
    ["London", "EGLL"],
    ["Paris", "LFPG"],
    ["Berlin", "EDDB"],
    ["Madrid", "LEMD"],
    ["Rome", "LIRF"],
    ["Tokyo", "RJTT"],
    ["Seoul", "RKSI"],
    ["Beijing", "ZBAA"],
    ["Shanghai", "ZSPD"],
    ["Hong Kong", "VHHH"],
    ["Sydney", "YSSY"],
    ["Melbourne", "YMML"],
    ["Singapore", "WSSS"],
    ["Dubai", "OMDB"],
    ["Istanbul", "LTFM"]
];

const CITY_MAP = new Map(
    CITY_STATIONS.map(([city, code]) => [code, city])
);

// =========================
// MAP INIT
// =========================
const map = new maplibregl.Map({
    container: "map",
    style: {
        version: 8,
        projection: { type: "globe" },
        sources: {},
        layers: []
    },
    center: [0, 20],
    zoom: 1
});

map.on('load', () => {

    map.addSource('naturalearth', {
        type: "raster",
        tiles: ["data/naturalearth/{z}/{x}/{y}.png"],
        tileSize: 512
    });

    map.addSource('gdps', {
        type: "raster",
        tiles: ["data/gdps/tiles/{z}/{x}/{y}.png"],
        tileSize: 256
    });

    map.addLayer({
        id: "naturalearth",
        type: "raster",
        source: "naturalearth",
        paint: {
            'raster-opacity': ['interpolate',['linear'],['zoom'],3,1,4,0],
            'raster-saturation': 0.2
        }
    });

    map.addLayer({
        id: "gdps",
        type: "raster",
        source: "gdps",
        paint: {
            'raster-opacity': ['interpolate',['linear'],['zoom'],3,1,4,0],
            "raster-contrast": 0.6,
            "raster-opacity": 0.7
        }
    });

    map.setRenderWorldCopies(false);
});

// =========================
// LOAD METARS
// =========================
async function loadMetars() {
    const res = await fetch('data/metars/metars.csv');
    const text = await res.text();

    const lines = text.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.trim());

    const stations = lines.slice(1).map(line => {
        const cols = line.split(',');

        const row = {};
        headers.forEach((h,i)=>row[h]=cols[i]);

        return {
            station_id: row.station_id,
            latitude: parseFloat(row.latitude),
            longitude: parseFloat(row.longitude),

            temp: row.temp_c,

            city: CITY_MAP.get(row.station_id) || row.station_id
        };
    })
    .filter(s =>
        CITY_MAP.has(s.station_id) &&
        Number.isFinite(s.latitude) &&
        Number.isFinite(s.longitude)
    );

    return stations;
}

function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// =========================
// HUD
// =========================
function updateHUD(s) {
    document.getElementById("hud-city").innerHTML =
        `<h2>${s.city}</h2>`;

    document.getElementById("hud-temp").innerHTML =
        `<h1>${Math.round(s.temp)}°</h1>`;

}

// =========================
// ANIMATION
// =========================
function panMap(stations) {
    if (!stations.length) return;

    const el = map.getContainer();
    let index = 0;

    function step() {
        const s = stations[index];
        index = (index + 1) % stations.length;

        if (!Number.isFinite(s.latitude) || !Number.isFinite(s.longitude)) {
            step();
            return;
        }

        el.style.opacity = 0;

        setTimeout(() => {
            map.jumpTo({ center: [s.longitude, s.latitude - 30] });

            updateHUD(s);

            el.style.opacity = 1;
        }, 500);
    }

    step();
    setInterval(step, 4000);
}

// =========================
// START
// =========================
async function start() {
    const stations = shuffle(await loadMetars());

    const first = stations[0];
    if (first) {
        map.jumpTo({ center: [first.longitude, first.latitude] });
        updateHUD(first);
        map.getContainer().style.opacity = 1;
    }

    panMap(stations);
}

start();
</script>
</body>
</html>
